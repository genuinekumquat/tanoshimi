<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head(${profileUser.name} + ' | 타노시미')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="wrap" style="max-width:600px;">
  <div class="card" style="padding:22px; display:flex; gap:18px; align-items:center;">
    <div style="position:relative; width:80px; height:80px; border-radius:50%; flex:none; overflow:hidden;
                background:var(--forest); color:#fff; display:flex; align-items:center; justify-content:center; font-size:28px;">
      <span th:text="${#strings.substring(profileUser.name,0,1)}">유</span>
      <img th:if="${profileUser.profileImageUrl}" th:src="@{${profileUser.profileImageUrl}}"
           onerror="this.style.display='none';"
           style="position:absolute; inset:0; width:100%; height:100%; object-fit:cover;">
    </div>
    <div style="flex:1;">
      <div style="font-weight:700; font-size:17px;" th:text="${profileUser.name}">이름</div>
      <div style="font-size:12px; color:var(--ink-soft);">
        <span th:text="${followerCount}">0</span>명 팔로워 · <span th:text="${followingCount}">0</span>명 팔로잉
      </div>
      <p style="font-size:12.5px;" th:text="${profileUser.intro}">자기소개</p>
    </div>
    <div sec:authorize="isAuthenticated()" style="display:flex; flex-direction:column; gap:8px;" th:if="${isSelf == false}">
      <button type="button" id="btn-follow" class="btn btn-primary"
              th:text="${isFollowing} ? '언팔로우' : '팔로우'" th:attr="data-target-id=${profileUser.id},data-following=${isFollowing}">팔로우</button>
      <button type="button" id="btn-message" class="btn" style="background:#fff; border:1px solid var(--line);"
              th:attr="data-target-id=${profileUser.id}">💬 메시지 보내기</button>
      <button type="button" th:attr="data-report-type='user',data-report-id=${profileUser.id},data-report-label=${profileUser.name}"
              style="font-size:11.5px; color:var(--ink-soft); background:none; border:none; cursor:pointer;">🚨 신고</button>
    </div>
  </div>
</main>

<script th:inline="javascript">
document.getElementById('btn-follow')?.addEventListener('click', async function () {
    const targetId = this.dataset.targetId;
    const following = this.dataset.following === 'true';
    const result = following ? await window.api.del(`/api/follow/${targetId}`) : await window.api.post(`/api/follow/${targetId}`, {});
    if (result.success) location.reload();
});
document.getElementById('btn-message')?.addEventListener('click', async function () {
    const result = await window.api.post(`/api/dm/${this.dataset.targetId}/room`, {});
    if (result.success) window.location.href = `/messages/${result.data}`;
    else alert(result.message);
});
</script>
</body>
</html>
