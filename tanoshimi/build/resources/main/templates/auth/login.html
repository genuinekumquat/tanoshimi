<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('로그인 | 타노시미')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="wrap" style="max-width:420px;">
  <div class="card" style="padding:28px;">
    <h1 style="font-size:22px; margin:0 0 6px;">로그인</h1>
    <p th:if="${errorMessage}" th:text="${errorMessage}" style="color:var(--danger); font-size:13px;"></p>

    <form th:action="@{/login}" method="post" style="display:flex; flex-direction:column; gap:12px;">
      <div>
        <label for="email" style="font-size:13px; font-weight:700;">이메일</label>
        <input type="text" id="email" name="email" required
               style="width:100%; padding:10px; border:1px solid var(--line); border-radius:8px;">
      </div>
      <div>
        <label for="password" style="font-size:13px; font-weight:700;">비밀번호</label>
        <input type="password" id="password" name="password" required
               style="width:100%; padding:10px; border:1px solid var(--line); border-radius:8px;">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%; padding:12px;">로그인</button>
    </form>

    <div style="text-align:center; margin:18px 0; color:var(--ink-soft); font-size:12px;">또는</div>

    <div style="display:flex; flex-direction:column; gap:8px;">
      <a th:href="@{/oauth2/authorization/google}" class="btn"
         style="background:#fff; border:1px solid var(--line); text-align:center;">Google로 시작하기</a>
      <a th:href="@{/oauth2/authorization/naver}" class="btn"
         style="background:#03c75a; color:#fff; text-align:center;">네이버로 시작하기</a>
      <a th:href="@{/oauth2/authorization/line}" class="btn"
         style="background:#06c755; color:#fff; text-align:center;">LINEで始める</a>
    </div>

    <p style="text-align:center; margin-top:18px; font-size:13px;">
      아직 계정이 없으신가요? <a th:href="@{/signup}">회원가입</a>
    </p>
  </div>
</main>
</body>
</html>
