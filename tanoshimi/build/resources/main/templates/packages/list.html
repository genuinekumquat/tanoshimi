<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('항공+숙박 패키지 | 타노시미')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="wrap">
  <style>
    .page-head h1{ font-size:26px; }
    .page-head .sub{ color:var(--ink-soft); font-size:13.5px; margin:6px 0 0; }

    .filter-row{ display:flex; gap:8px; flex-wrap:wrap; margin:18px 0; }
    .filter-row select{
      border:1px solid var(--line); border-radius:9px; padding:8px 12px; font-family:inherit;
      font-size:12.5px; background:var(--card); color:var(--ink);
    }

    .pkg-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(270px,1fr)); gap:18px; margin-top:18px; }
    .pkg-card{ overflow:hidden; display:flex; flex-direction:column; cursor:pointer; transition:transform .15s, box-shadow .15s; text-decoration:none; color:inherit; }
    .pkg-card:hover{ transform:translateY(-3px); box-shadow:0 10px 22px rgba(59,44,20,.16); border-color:var(--sash); }

    .thumb{ position:relative; height:150px; }
    .thumb .ph{ position:absolute; inset:0; }
    .thumb .ph1{ background:linear-gradient(135deg,var(--sky),#c7dfe6); }
    .thumb .ph2{ background:linear-gradient(135deg,#e7cf9d,var(--parchment-deep)); }
    .thumb .ph3{ background:linear-gradient(135deg,#cfe0c8,#a9c7a1); }
    .thumb .ph4{ background:linear-gradient(135deg,#e3b7a0,#d99a86); }
    .thumb .region-tag{
      position:absolute; top:9px; left:9px; font-size:11px; font-weight:700; background:var(--sky); color:#1c3a44;
      border-radius:999px; padding:4px 11px;
    }
    .thumb .nights{
      position:absolute; right:9px; bottom:9px; background:rgba(58,46,34,.72); color:#fff;
      font-size:11px; border-radius:999px; padding:4px 10px;
    }

    .pkg-body{ padding:13px 15px 15px; display:flex; flex-direction:column; gap:8px; flex:1; }
    .pkg-body .t{ font-size:14.5px; font-weight:700; margin:0; }
    .includes{ display:flex; flex-wrap:wrap; gap:5px; }
    .includes span{ font-size:10.5px; background:var(--parchment-deep); color:var(--ink-soft); border-radius:999px; padding:3px 9px; }
    .pkg-foot{ margin-top:auto; display:flex; align-items:center; justify-content:space-between; padding-top:8px; border-top:1px dashed var(--line); }
    .price{ font-family:'Jua',sans-serif; font-size:15px; color:var(--sash-deep); line-height:1.3; }
    .price small{ font-family:'Gowun Dodum',sans-serif; font-size:10px; color:var(--ink-soft); font-weight:400; display:block; }

    @media (prefers-reduced-motion:reduce){ *{ transition:none !important; } }
  </style>

  <div class="page-head">
    <h1>항공+숙박 패키지</h1>
    <p class="sub">항공권과 숙소가 이미 포함된 여행 패키지입니다. 예약 후 세부 일정은 계획표에서 직접 짤 수 있어요.</p>
  </div>

  <p th:if="${partyId}" style="background:#dcebd6; padding:10px; border-radius:8px; font-size:12.5px; margin-top:10px;">
    🎉 파티에 연결해서 예약할 패키지를 골라주세요.
  </p>

  <div class="filter-row">
    <select id="f-region">
      <option value="" th:selected="${selectedRegion == null or selectedRegion == ''}">전체 지역</option>
      <option th:each="city : ${ {'오사카','도쿄','교토','후쿠오카','홋카이도','오키나와'} }"
              th:value="${r}" th:text="${r}" th:selected="${r == selectedRegion}"></option>
    </select>
    <select id="f-sort">
      <option value="recommend" th:selected="${selectedSort == null or selectedSort == 'recommend'}">추천순</option>
      <option value="price_low" th:selected="${selectedSort == 'price_low'}">낮은 가격순</option>
      <option value="price_high" th:selected="${selectedSort == 'price_high'}">높은 가격순</option>
    </select>
  </div>
  <div class="pkg-grid" id="pkg-grid">
    <a th:each="tour : ${tours}" class="pkg-card card" th:href="@{/packages/{id}(id=${tour.id},partyId=${partyId})}">
      <div class="thumb">
        <div class="ph" th:classappend="${tour.thumbnailUrl}"></div>
        <span class="region-tag">📍 <span th:text="${tour.region}">지역</span></span>
        <span class="nights"><span th:text="${tour.durationNights}">0</span>박<span th:text="${tour.durationNights + 1}">0</span>일</span>
      </div>
      <div class="pkg-body">
        <p class="t" th:text="${tour.title}">패키지 제목</p>
        <div class="pkg-foot">
          <div class="price">
            ₩<span th:text="${#numbers.formatInteger(tour.priceKrw,0,'COMMA')}">0</span>
            <small>¥<span th:text="${#numbers.formatInteger(tour.priceJpy,0,'COMMA')}">0</span> · 1인 기준</small>
          </div>
          <span class="btn btn-primary">자세히</span>
        </div>
      </div>
    </a>
  </div>
</main>

<script th:inline="javascript">
/*<![CDATA[*/
const PARTY_ID_FOR_FILTER = /*[[${partyId}]]*/ null;
/*]]>*/
</script>
<script th:src="@{/js/package-filter.js}" defer></script>
</body>
</html>
