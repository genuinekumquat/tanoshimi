<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('비밀번호 확인 | 고객센터 | 타노시미')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="wrap">
  <div style="max-width:500px; margin: 50px auto; background: var(--card); padding: 30px; border-radius: 10px; border: 1px solid var(--line); text-align: center;">
    <h2 style="margin-top:0; margin-bottom:10px;">비밀글입니다</h2>
    <p style="color: var(--ink-soft); margin-bottom: 30px;">글 작성 시 입력한 아이디와 비밀번호를 입력해주세요.</p>
    
    <div th:if="${error}" style="text-align:left; color: red; margin-bottom: 20px; font-size: 14px;" th:text="${error}"></div>
    
    <form th:action="@{/support/{id}/auth(id=${id})}" method="post" style="text-align: left;">
      <div style="margin-bottom: 15px;">
        <label for="guestId" style="display:block; font-weight: bold; margin-bottom: 8px;">아이디</label>
        <input type="text" id="guestId" name="guestId" required placeholder="작성자 아이디" class="input" style="width: 100%; padding: 10px; border: 1px solid var(--line); border-radius: 6px;">
      </div>
      
      <div style="margin-bottom: 25px;">
        <label for="guestPassword" style="display:block; font-weight: bold; margin-bottom: 8px;">비밀번호</label>
        <input type="password" id="guestPassword" name="guestPassword" required placeholder="비밀번호" class="input" style="width: 100%; padding: 10px; border: 1px solid var(--line); border-radius: 6px;">
      </div>
      
      <div style="display: flex; gap: 10px;">
        <a th:href="@{/support}" class="btn" style="flex:1; text-align:center; border: 1px solid var(--line); background: white;">목록으로</a>
        <button type="submit" class="btn btn-primary" style="flex:1;">확인</button>
      </div>
    </form>
  </div>
</main>
<div th:replace="~{fragments/layout :: companion}"></div>
</body>
</html>
