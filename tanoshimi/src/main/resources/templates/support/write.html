<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('문의하기 | 고객센터 | 타노시미')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="wrap">
  <div style="max-width:600px; margin: 0 auto; background: var(--card); padding: 30px; border-radius: 10px; border: 1px solid var(--line);">
    <h2 style="margin-top:0; border-bottom:1px solid var(--line); padding-bottom:15px; margin-bottom:20px;">문의하기</h2>
    
    <form th:action="@{/support/write}" method="post">
      <div style="margin-bottom: 20px;">
        <label for="guestId" style="display:block; font-weight: bold; margin-bottom: 8px;">작성자 아이디</label>
        <input type="text" id="guestId" name="guestId" required placeholder="아이디를 입력하세요" class="input" style="width: 100%; padding: 10px; border: 1px solid var(--line); border-radius: 6px;">
      </div>
      
      <div style="margin-bottom: 20px;">
        <label for="guestPassword" style="display:block; font-weight: bold; margin-bottom: 8px;">비밀번호</label>
        <input type="password" id="guestPassword" name="guestPassword" required placeholder="비밀번호를 입력하세요" class="input" style="width: 100%; padding: 10px; border: 1px solid var(--line); border-radius: 6px;">
        <p style="font-size: 12px; color: var(--ink-soft); margin-top: 5px;">* 작성한 글을 다시 확인하기 위해 필요합니다.</p>
      </div>
      
      <div style="margin-bottom: 20px;">
        <label for="title" style="display:block; font-weight: bold; margin-bottom: 8px;">제목</label>
        <input type="text" id="title" name="title" required placeholder="제목을 입력하세요" class="input" style="width: 100%; padding: 10px; border: 1px solid var(--line); border-radius: 6px;">
      </div>
      
      <div style="margin-bottom: 20px;">
        <label for="content" style="display:block; font-weight: bold; margin-bottom: 8px;">내용</label>
        <textarea id="content" name="content" required placeholder="문의 내용을 입력하세요" class="input" style="width: 100%; min-height: 200px; padding: 10px; border: 1px solid var(--line); border-radius: 6px; resize: vertical;"></textarea>
      </div>
      
      <div style="display: flex; gap: 10px; justify-content: flex-end;">
        <a th:href="@{/support}" class="btn" style="border: 1px solid var(--line); background: white;">취소</a>
        <button type="submit" class="btn btn-primary">등록하기</button>
      </div>
    </form>
  </div>
</main>
<div th:replace="~{fragments/layout :: companion}"></div>
</body>
</html>
