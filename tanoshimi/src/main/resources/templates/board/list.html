<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('여행 게시판 | 타노시미')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<style>
  /* 여행 게시판 — 「藍」 시스템. 공통 요소(.page-head/.card/.btn/폼)는 app.css 에 있고
     여기에는 이 화면의 피드 레이아웃만 둔다. */

  /* ---------- 툴바 ---------- */
  .toolbar{ display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:20px; }

  /* 세그먼트 컨트롤 : 알약 배경 대신 헤어라인 테두리 + 선택된 것만 남색 */
  .view-toggle{ display:inline-flex; gap:2px; padding:3px; background:var(--surface);
                border:1px solid var(--hairline-cool); border-radius:var(--r-pill); }
  .view-toggle button{
    font-family:inherit; font-size:12.5px; font-weight:700; color:var(--ink-soft);
    background:none; border:none; border-radius:var(--r-pill); padding:7px 16px;
    cursor:pointer; display:flex; align-items:center; gap:5px; transition:all .18s var(--ease);
  }
  .view-toggle button:hover{ color:var(--ai-600); }
  .view-toggle button.on{ background:#0b1730; color:#fff; }

  .toolbar .filter-select{ font-size:13px; padding:9px 12px; }
  .toolbar #f-keyword{ width:210px; }

  /* ---------- 썸네일 그리드 (인스타 타일) ---------- */
  .feed-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
  @media (max-width:560px){ .feed-grid{ grid-template-columns:repeat(2,1fr); gap:8px; } }

  .feed-item{
    position:relative; display:block; aspect-ratio:1; overflow:hidden; cursor:pointer;
    border-radius:var(--r-lg); background:var(--washi-2); box-shadow:var(--sh-1);
  }
  .feed-item .ph, .feed-item img{
    position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
    transition:transform .6s var(--ease-out);
  }
  .feed-item:hover .ph, .feed-item:hover img{ transform:scale(1.06); }
  .feed-item::after{
    content:''; position:absolute; inset:0; pointer-events:none;
    background:linear-gradient(to top, rgba(8,19,42,.86) 0%, rgba(8,19,42,.25) 45%, rgba(8,19,42,0) 70%);
  }
  .feed-item .region-tag, .feed-item .likes{
    position:absolute; top:10px; z-index:2;
    font-size:11px; font-weight:800; color:#fff;
    background:rgba(8,19,42,.5); backdrop-filter:blur(6px);
    border-radius:var(--r-pill); padding:4px 10px;
  }
  .feed-item .region-tag{ left:10px; }
  .feed-item .likes{ right:10px; }
  .feed-item .cap{
    position:absolute; left:0; right:0; bottom:0; z-index:2;
    padding:14px; font-size:13.5px; font-weight:700; color:#fff;
    text-shadow:0 1px 8px rgba(0,0,0,.5); background:none;
  }

  /* ---------- 리스트 모드 ---------- */
  .feed-list{ display:flex; flex-direction:column; gap:10px; }
  .list-item{
    display:flex; gap:14px; padding:12px; align-items:center; cursor:pointer;
    background:var(--surface); border:1px solid var(--hairline-cool);
    border-radius:var(--r-md); transition:all .2s var(--ease);
  }
  .list-item:hover{ border-color:var(--ai-300); transform:translateY(-2px); box-shadow:var(--sh-1); }
  .list-item .thumb{ width:68px; height:68px; border-radius:var(--r-sm); flex:none; overflow:hidden; }
  .list-item .info{ flex:1; min-width:0; }
  .list-item .t{ font-size:14.5px; font-weight:700; margin:0 0 4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .list-item .oneliner{ font-size:12.5px; color:var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin:0 0 5px; }
  .list-item .meta{ display:flex; gap:10px; font-size:11.5px; color:var(--ink-faint); }

  .hidden{ display:none !important; }

  /* ---------- 페이지네이션 ---------- */
  .pagination{ display:flex; justify-content:center; align-items:center; gap:6px; margin-top:34px; }
  .pagination .page-link{
    display:inline-flex; align-items:center; justify-content:center; min-width:34px; height:34px; padding:0 9px;
    border-radius:var(--r-sm); font-size:12.5px; font-weight:700; color:var(--ink-soft);
    border:1px solid var(--hairline-cool); background:var(--surface);
    font-variant-numeric:tabular-nums; transition:all .16s var(--ease);
  }
  .pagination .page-link:hover{ border-color:var(--ai-300); color:var(--ai-600); }
  .pagination .page-link.on{ background:#0b1730; color:#fff; border-color:#0b1730; }
  .pagination .page-link.disabled{ opacity:.35; pointer-events:none; }
</style>

<main class="wrap">
  <div class="page-head">
    <div>
      <h1>여행 게시판</h1>
      <p class="sub">다른 여행자들의 후기와 스냅을 둘러보세요.</p>
    </div>
    <button type="button" id="btn-write" class="btn btn-primary" sec:authorize="isAuthenticated()">✏️ 글쓰기</button>
  </div>

  <div class="toolbar">
    <div class="view-toggle">
      <button class="on" id="btn-grid">▦ 썸네일</button>
      <button id="btn-list">☰ 제목</button>
    </div>
    <div style="display:flex; gap:8px;">
      <input type="text" class="filter-select" id="f-keyword" placeholder="제목/내용 검색" style="width:200px;">
      <select class="filter-select" id="f-region">
        <option value="">전체 지역</option>
        <option>오사카</option><option>도쿄</option><option>교토</option>
        <option>후쿠오카</option><option>홋카이도</option><option>오키나와</option>
      </select>
    </div>
  </div>

  <div th:if="${#lists.isEmpty(posts.content)}" style="padding:80px 0; text-align:center; color:var(--ink-soft); font-size:14px;">
    <span th:if="${keyword != null and !keyword.isEmpty()}" th:text="'\'' + ${keyword} + '\' 검색 결과가 없습니다.'">검색 결과가 없습니다.</span>
    <span th:unless="${keyword != null and !keyword.isEmpty()}">아직 게시글이 없습니다.</span>
  </div>

  <div class="feed-grid" id="feed-grid">
    <a th:each="post : ${posts.content}" class="feed-item" th:href="@{'/board/' + ${post.id}}" th:aria-label="${post.title}">
      <span th:if="${post.thumbnailUrl != null and #strings.startsWith(post.thumbnailUrl,'/uploads/')}" 
            class="ph" th:style="'background: url(' + @{${post.thumbnailUrl}} + ') center/cover no-repeat;'"></span>
      <span th:unless="${post.thumbnailUrl != null and #strings.startsWith(post.thumbnailUrl,'/uploads/')}" 
            th:classappend="${post.thumbnailUrl} ?: 'ph1'" class="ph"></span>
      <span class="region-tag" th:text="'📍 ' + (${post.region} ?: '지역미정')">📍 지역미정</span>
      <span class="likes" th:text="'❤️ ' + ${post.likeCount}">❤️ 0</span>
      <span class="report-btn" style="position:absolute; bottom:10px; right:10px; z-index:10;" sec:authorize="isAuthenticated()">
         <span th:attr="data-report-type='post',data-report-id=${post.id},data-report-label=${post.title}" style="font-size:11px; padding:3px 6px; background:rgba(255,255,255,0.9); border:1px solid #f7d8d1; color:red; border-radius:4px; font-weight:bold; cursor:pointer;">🚨 신고</span>
      </span>
      <span class="cap" th:text="${post.content}">내용</span>
    </a>
  </div>

  <div class="feed-list hidden" id="feed-list">
    <a th:each="post : ${posts.content}" class="list-item card" th:href="@{'/board/' + ${post.id}}">
      <span th:if="${post.thumbnailUrl != null and #strings.startsWith(post.thumbnailUrl,'/uploads/')}" 
            class="thumb ph" th:style="'display:block; background: url(' + @{${post.thumbnailUrl}} + ') center/cover no-repeat;'"></span>
      <span th:unless="${post.thumbnailUrl != null and #strings.startsWith(post.thumbnailUrl,'/uploads/')}" 
            th:classappend="${post.thumbnailUrl} ?: 'ph1'" class="thumb ph" style="display:block;"></span>
      <span class="info">
        <p class="t" th:text="${post.title}">제목</p>
        <p class="oneliner" th:text="${post.content}">내용</p>
        <span class="meta">
          <span th:text="'📍 ' + (${post.region} ?: '지역미정')">📍 지역미정</span>
          <span th:text="'❤️ ' + ${post.likeCount}">❤️ 0</span>
          <span th:text="'@' + ${post.user.name}">@작성자</span>
          <span class="report-btn" style="margin-left:auto;" sec:authorize="isAuthenticated()">
              <span th:attr="data-report-type='post',data-report-id=${post.id},data-report-label=${post.title}" style="font-size:11px; padding:3px 6px; background:#fff; border:1px solid #f7d8d1; color:red; border-radius:4px; font-weight:bold; cursor:pointer;">🚨 신고</span>
          </span>
        </span>
      </span>
    </a>
  </div>

  <nav class="pagination" th:if="${posts.totalPages > 1}">
    <a th:if="${posts.hasPrevious()}" th:href="@{/board(region=${region}, q=${keyword}, page=${posts.number - 1})}" class="page-link">‹</a>
    <span th:unless="${posts.hasPrevious()}" class="page-link disabled">‹</span>

    <a th:each="i : ${#numbers.sequence(0, posts.totalPages - 1)}"
       th:href="@{/board(region=${region}, q=${keyword}, page=${i})}"
       th:text="${i + 1}"
       th:classappend="${i == posts.number} ? 'on' : ''"
       class="page-link">1</a>

    <a th:if="${posts.hasNext()}" th:href="@{/board(region=${region}, q=${keyword}, page=${posts.number + 1})}" class="page-link">›</a>
    <span th:unless="${posts.hasNext()}" class="page-link disabled">›</span>
  </nav>

  <div id="write-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:60; align-items:center; justify-content:center;">
    <div class="card" style="width:420px; padding:20px;">
      <h2 style="font-size:16px;">글쓰기</h2>
      <input type="text" id="w-title" placeholder="제목" style="width:100%; padding:9px; margin-bottom:8px; border:1px solid var(--line); border-radius:8px;">
      <textarea id="w-content" placeholder="내용을 입력하세요" style="width:100%; min-height:120px; padding:9px; border:1px solid var(--line); border-radius:8px;"></textarea>
      <input type="text" id="w-region" placeholder="지역(선택)" style="width:100%; padding:9px; margin-top:8px; border:1px solid var(--line); border-radius:8px;">
      <label style="display:block; font-size:12px; font-weight:700; margin-top:10px; margin-bottom:4px;">사진 (선택, 없으면 기본 이미지)</label>
      <input type="file" id="w-thumbnail" accept="image/png,image/jpeg,image/gif,image/webp" style="width:100%; font-size:12.5px;">
      <img id="w-thumbnail-preview" style="display:none; width:100%; max-height:160px; object-fit:cover; border-radius:8px; margin-top:8px;">
      <div style="display:flex; gap:8px; margin-top:12px;">
        <button type="button" id="btn-write-cancel" class="btn" style="flex:1; background:#fff; border:1px solid var(--line);">취소</button>
        <button type="button" id="btn-write-submit" class="btn btn-primary" style="flex:1;">등록</button>
      </div>
    </div>
  </div>
</main>

<script th:src="@{/js/post-write.js}" defer></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    // 뷰 토글
    const btnGrid = document.getElementById('btn-grid');
    const btnList = document.getElementById('btn-list');
    const feedGrid = document.getElementById('feed-grid');
    const feedList = document.getElementById('feed-list');

    if (btnGrid && btnList) {
        btnGrid.addEventListener('click', () => {
            btnGrid.classList.add('on');
            btnList.classList.remove('on');
            feedGrid.classList.remove('hidden');
            feedList.classList.add('hidden');
        });
        
        btnList.addEventListener('click', () => {
            btnList.classList.add('on');
            btnGrid.classList.remove('on');
            feedList.classList.remove('hidden');
            feedGrid.classList.add('hidden');
        });
    }

    // 지역 필터 + 검색 - URL 파라미터 적용, 변경/검색 시 이동 (둘 다 유지한 채 페이지는 1로 리셋)
    const regionSelect = document.getElementById('f-region');
    const keywordInput = document.getElementById('f-keyword');
    const urlParams = new URLSearchParams(window.location.search);
    const currentRegion = urlParams.get('region');
    const currentKeyword = urlParams.get('q');

    if (currentRegion && regionSelect) regionSelect.value = currentRegion;
    if (currentKeyword && keywordInput) keywordInput.value = currentKeyword;

    function goSearch() {
        const params = new URLSearchParams();
        if (regionSelect && regionSelect.value) params.set('region', regionSelect.value);
        if (keywordInput && keywordInput.value.trim()) params.set('q', keywordInput.value.trim());
        const qs = params.toString();
        window.location.href = qs ? ('?' + qs) : window.location.pathname;
    }

    regionSelect?.addEventListener('change', goSearch);
    keywordInput?.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') goSearch();
    });
});
</script>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: companion}"></div>
</body>
</html>
