<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('회원가입 | 타노시미')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="wrap" style="max-width:460px;">
  <div class="card" style="padding:28px;">
    <h1 style="font-size:22px; margin:0 0 6px;">회원가입</h1>
    <p style="color:var(--ink-soft); font-size:13px; margin:0 0 18px;">이메일 인증으로 가입합니다.</p>

    <div id="signup-form" style="display:flex; flex-direction:column; gap:14px;">

      <div class="field">
        <label>이메일 *</label>
        <div style="display:flex; gap:8px;">
          <input type="email" id="email" placeholder="example@email.com" style="flex:1;">
          <button type="button" id="btn-email-check" class="btn" style="border:1px solid var(--line); background:#fff;">중복확인</button>
        </div>
        <p class="msg" id="msg-email"></p>
      </div>

      <!-- 이메일 중복확인을 통과한 뒤에 인증번호를 받는다(존재하지도 않는 이메일에 발송 낭비 방지). -->
      <div class="field">
        <label>이메일 인증 *</label>
        <div style="display:flex; gap:8px;">
          <button type="button" id="btn-send-code" class="btn" style="border:1px solid var(--line); background:#fff;" disabled>인증요청</button>
        </div>
        <p class="msg" id="msg-email-verify"></p>
      </div>

      <div class="field hidden" id="code-field" style="display:none;">
        <label>인증번호 *</label>
        <div style="display:flex; gap:8px; align-items:center;">
          <input type="text" id="code" maxlength="6" style="flex:1;">
          <span id="timer" style="font-size:12px; color:var(--danger);">05:00</span>
          <button type="button" id="btn-confirm-code" class="btn" style="border:1px solid var(--line); background:#fff;">확인</button>
        </div>
        <p class="msg" id="msg-code"></p>
      </div>

      <div class="field">
        <label>아이디 *</label>
        <div style="display:flex; gap:8px;">
          <input type="text" id="username" placeholder="영문 소문자로 시작, 3~20자 (소문자/숫자/밑줄)" style="flex:1;">
          <button type="button" id="btn-username-check" class="btn" style="border:1px solid var(--line); background:#fff;">중복확인</button>
        </div>
        <p class="msg" id="msg-username"></p>
      </div>

      <div class="field">
        <label>비밀번호 *</label>
        <input type="password" id="password" placeholder="8~20자, 영문/숫자/특수문자 중 2가지 이상">
        <p class="msg" id="msg-password"></p>
      </div>
      <div class="field">
        <label>비밀번호 확인 *</label>
        <input type="password" id="passwordConfirm">
        <p class="msg" id="msg-password-confirm"></p>
      </div>

      <div class="field">
        <label>이름 *</label>
        <input type="text" id="name" placeholder="한글/영문/가나 2~20자">
      </div>

      <div style="display:flex; gap:10px;">
        <div class="field" style="flex:1;">
          <label>성별 *</label>
          <select id="gender" style="width:100%;">
            <option value="">선택</option>
            <option value="male">남성</option>
            <option value="female">여성</option>
          </select>
        </div>
        <div class="field" style="flex:1;">
          <label>국적 *</label>
          <select id="nationality" style="width:100%;">
            <option value="">선택</option>
            <option value="KR">한국</option>
            <option value="JP">일본</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label>생년월일 *</label>
        <input type="date" id="birthDate">
      </div>

      <div class="field">
        <label>휴대폰 번호 *</label>
        <input type="tel" id="phone" placeholder="010-0000-0000">
        <!-- 본인인증 채널이 이메일로 바뀌면서(SMS API는 사업자등록번호 필요) 휴대폰 번호는
             인증 없이 받는 연락처 항목이 됐다. -->
      </div>

      <label style="display:flex; align-items:center; gap:8px; font-size:13px;">
        <input type="checkbox" id="termsAgreed"> [필수] 이용약관 및 개인정보 처리방침에 동의합니다.
      </label>

      <p class="msg error" id="msg-form" style="color:var(--danger);"></p>

      <button type="button" id="btn-signup" class="btn btn-primary" style="padding:12px;" disabled>가입하기</button>
    </div>

    <div style="text-align:center; margin:18px 0; color:var(--ink-soft); font-size:12px;">또는</div>
    <div style="display:flex; flex-direction:column; gap:8px;">
      <a th:href="@{/oauth2/authorization/google}" class="btn" style="background:#fff; border:1px solid var(--line); text-align:center;">Google로 시작하기</a>
      <a th:href="@{/oauth2/authorization/naver}" class="btn" style="background:#03c75a; color:#fff; text-align:center;">네이버로 시작하기</a>
      <a th:href="@{/oauth2/authorization/line}" class="btn" style="background:#06c755; color:#fff; text-align:center;">LINEで始める</a>
    </div>
  </div>
</main>

<style>
  .field label{ display:block; font-size:12.5px; font-weight:700; margin-bottom:5px; }
  .field input, .field select{ width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:8px; font-family:inherit; }
  .msg{ min-height:16px; font-size:11.5px; margin:4px 0 0; }
  .msg.success{ color:var(--forest); }
  .msg.error{ color:var(--danger); }
</style>

<script th:src="@{/js/signup.js}" defer></script>
<div th:replace="~{fragments/layout :: companion}"></div>
</body>
</html>
