<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('비밀번호 찾기 | 타노시미')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="wrap" style="max-width:420px;">
  <div class="card" style="padding:28px;">
    <h1 style="font-size:22px; margin:0 0 6px;">비밀번호 찾기</h1>
    <p style="color:var(--ink-soft); font-size:13px; margin:0 0 18px;">
      가입한 이메일로 임시 비밀번호를 보내드려요. 로그인 후 새 비밀번호로 꼭 바꿔 주세요.
    </p>

    <div id="find-password-form" style="display:flex; flex-direction:column; gap:14px;">
      <div class="field">
        <label>이메일 *</label>
        <input type="email" id="email" placeholder="example@email.com">
        <p class="msg" id="msg-email"></p>
      </div>

      <button type="button" id="btn-find-password" class="btn btn-primary" style="padding:12px;">임시 비밀번호 받기</button>
    </div>

    <p style="text-align:center; margin-top:18px; font-size:13px;">
      <a th:href="@{/login}">로그인으로 돌아가기</a>
    </p>
  </div>
</main>

<style>
  .field label{ display:block; font-size:12.5px; font-weight:700; margin-bottom:5px; }
  .field input{ width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:8px; font-family:inherit; }
  .msg{ min-height:16px; font-size:11.5px; margin:4px 0 0; }
  .msg.success{ color:var(--forest); }
  .msg.error{ color:var(--danger); }
</style>

<script th:src="@{/js/find-password.js}" defer></script>
</body>
</html>
