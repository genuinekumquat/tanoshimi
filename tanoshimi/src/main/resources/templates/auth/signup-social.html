<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('추가 정보 입력 | 타노시미')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="wrap" style="max-width:460px;">
  <div class="card" style="padding:28px;">
    <h1 style="font-size:22px;">추가 정보 입력</h1>
    <p style="color:var(--ink-soft); font-size:13px;">
      <b th:text="${providerName}">소셜</b> 계정으로 처음 오셨네요. 예약 안내를 위해 몇 가지 정보가 더 필요해요.
    </p>

    <div style="display:flex; flex-direction:column; gap:14px;" id="social-form">
      <div class="field" th:if="${needEmailInput}">
        <label>이메일 *</label>
        <input type="email" id="email">
      </div>
      <div class="field" th:unless="${needEmailInput}">
        <label>이메일</label>
        <input type="email" th:value="${email}" disabled>
      </div>

      <div class="field">
        <label>이름 *</label>
        <input type="text" id="name" th:value="${suggestedName}">
      </div>

      <div class="field">
        <label>아이디 *</label>
        <div style="display:flex; gap:8px;">
          <input type="text" id="username" placeholder="영문 소문자로 시작, 3~20자 (소문자/숫자/밑줄)" style="flex:1;">
          <button type="button" id="btn-username-check" class="btn" style="border:1px solid var(--line); background:#fff;">중복확인</button>
        </div>
        <p class="msg" id="msg-username"></p>
      </div>

      <div style="display:flex; gap:10px;">
        <div class="field" style="flex:1;">
          <label>성별 *</label>
          <select id="gender" style="width:100%;">
            <option value="">선택</option><option value="male">남성</option><option value="female">여성</option>
          </select>
        </div>
        <div class="field" style="flex:1;">
          <label>국적 *</label>
          <select id="nationality" style="width:100%;">
            <option value="">선택</option><option value="KR">한국</option><option value="JP">일본</option>
          </select>
        </div>
      </div>

      <div class="field"><label>생년월일 *</label><input type="date" id="birthDate"></div>

      <div class="field">
        <label>휴대폰 번호 *</label>
        <div style="display:flex; gap:8px;">
          <input type="tel" id="phone" style="flex:1;">
          <button type="button" id="btn-send-code" class="btn" style="border:1px solid var(--line); background:#fff;">인증요청</button>
        </div>
        <p class="msg" id="msg-phone"></p>
      </div>
      <div class="field" id="code-field" style="display:none;">
        <label>인증번호 *</label>
        <div style="display:flex; gap:8px; align-items:center;">
          <input type="text" id="code" maxlength="6" style="flex:1;">
          <span id="timer" style="font-size:12px; color:var(--danger);">05:00</span>
          <button type="button" id="btn-confirm-code" class="btn" style="border:1px solid var(--line); background:#fff;">확인</button>
        </div>
        <p class="msg" id="msg-code"></p>
      </div>

      <label style="display:flex; align-items:center; gap:8px; font-size:13px;">
        <input type="checkbox" id="termsAgreed"> [필수] 이용약관 및 개인정보 처리방침에 동의합니다.
      </label>
      <p class="msg error" id="msg-form" style="color:var(--danger);"></p>
      <button type="button" id="btn-submit" class="btn btn-primary" style="padding:12px;" disabled>가입 완료</button>
    </div>
  </div>
</main>
<style>
  .field label{ display:block; font-size:12.5px; font-weight:700; margin-bottom:5px; }
  .field input, .field select{ width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:8px; font-family:inherit; }
  .msg{ min-height:16px; font-size:11.5px; margin:4px 0 0; }
  .msg.success{ color:var(--forest); } .msg.error{ color:var(--danger); }
</style>
<script th:src="@{/js/signup-social.js}" defer></script>
<div th:replace="~{fragments/layout :: companion}"></div>
</body>
</html>
