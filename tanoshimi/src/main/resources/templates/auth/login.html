<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('로그인 | 타노시미')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<style>
  /* 토글 스위치 - mypage/account.html 알림 설정과 동일한 스타일 */
  .switch{ position:relative; display:inline-block; width:38px; height:22px; flex:none; }
  .switch input{ opacity:0; width:0; height:0; }
  .switch .slider{
    position:absolute; inset:0; background:#d8c69a; border-radius:999px; cursor:pointer; transition:.2s;
  }
  .switch .slider::before{
    content:""; position:absolute; width:16px; height:16px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.2s;
    box-shadow:0 1px 2px rgba(0,0,0,.25);
  }
  .switch input:checked + .slider{ background:var(--forest); }
  .switch input:checked + .slider::before{ transform:translateX(16px); }
  .switch input:focus-visible + .slider{ outline:3px solid var(--gold); outline-offset:2px; }
</style>

<main class="wrap" style="max-width:420px;">
  <div class="card" style="padding:28px;">
    <div style="display:flex; align-items:center; justify-content:space-between; margin:0 0 6px;">
      <h1 style="font-size:22px; margin:0;">로그인</h1>
      <label style="display:flex; align-items:center; gap:7px; cursor:pointer;">
        <span style="font-size:12.5px; font-weight:700; color:var(--ink-soft);">자동 로그인</span>
        <span class="switch">
          <input type="checkbox" id="remember-me" name="remember-me" form="login-form">
          <span class="slider"></span>
        </span>
      </label>
    </div>
    <p th:if="${errorMessage}" th:text="${errorMessage}" style="color:var(--danger); font-size:13px;"></p>

    <form id="login-form" th:action="@{/login}" method="post" style="display:flex; flex-direction:column; gap:12px;">
      <div>
        <label for="email" style="font-size:13px; font-weight:700;">이메일</label>
        <input type="text" id="email" name="email" required
               style="width:100%; padding:10px; border:1px solid var(--line); border-radius:8px;">
      </div>
      <div>
        <label for="password" style="font-size:13px; font-weight:700;">비밀번호</label>
        <input type="password" id="password" name="password" required
               style="width:100%; padding:10px; border:1px solid var(--line); border-radius:8px;">
      </div>

      <button type="submit" class="btn btn-primary" style="width:100%; padding:12px;">로그인</button>
    </form>

    <p style="text-align:right; margin:8px 0 0; font-size:12.5px;">
      <a th:href="@{/find-password}" style="color:var(--ink-soft);">비밀번호를 잊으셨나요?</a>
    </p>

    <div style="text-align:center; margin:18px 0; color:var(--ink-soft); font-size:12px;">또는</div>

    <div style="display:flex; flex-direction:column; gap:8px;">
      <a th:href="@{/oauth2/authorization/google}" class="btn"
         style="background:#fff; border:1px solid var(--line); text-align:center;">Google로 시작하기</a>
      <a th:href="@{/oauth2/authorization/naver}" class="btn"
         style="background:#03c75a; color:#fff; text-align:center;">네이버로 시작하기</a>
      <a th:href="@{/oauth2/authorization/line}" class="btn"
         style="background:#06c755; color:#fff; text-align:center;">LINEで始める</a>
    </div>

    <p style="text-align:center; margin-top:18px; font-size:13px;">
      아직 계정이 없으신가요? <a th:href="@{/signup}">회원가입</a>
    </p>
  </div>
</main>
<div th:replace="~{fragments/layout :: companion}"></div>
</body>
</html>
