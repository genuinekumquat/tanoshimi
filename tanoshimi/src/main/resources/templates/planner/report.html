<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>여행 플랜 보고서</title>
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Gowun Dodum', 'Apple SD Gothic Neo', sans-serif;
            color: var(--ink);
            background-color: #ffffff;
            margin: 0;
            padding: 40px;
            line-height: 1.5;
            max-width: 900px;
            margin: 0 auto;
            font-size: 15px;
        }
        h1, h2, h3, h4, h5 {
            font-family: var(--font-display), 'Gowun Dodum', sans-serif;
            color: var(--forest);
            margin-top: 1.5em;
            margin-bottom: 0.5em;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 15px 0;
            font-size: 0.9em;
        }
        th, td {
            border: 1px solid var(--line);
            padding: 8px 10px;
            text-align: left;
        }
        th {
            background-color: var(--parchment);
            font-weight: bold;
        }
        .ai-report-content {
            padding: 20px;
            border: 2px dashed var(--forest);
            border-radius: 12px;
            background-color: #faf8f2;
        }
        ul, ol {
            padding-left: 20px;
            margin: 8px 0;
        }
        li {
            margin-bottom: 4px;
        }
        b, strong {
            color: #c8a94b;
        }
        .header {
            text-align: center;
            border-bottom: 2px solid var(--forest);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }
        @media print {
            @page {
                size: A4;
                margin: 20mm;
            }
            body {
                padding: 0;
            }
            .ai-report-content {
                border: none;
                background-color: transparent;
                padding: 0;
            }
            table {
                page-break-inside: auto;
            }
            tr {
                page-break-inside: avoid;
                page-break-after: auto;
            }
            h1, h2, h3, h4, h5 {
                page-break-after: avoid;
            }
            .header {
                margin-top: 0;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>여행 플랜 경로 리포트</h1>
        <p>AI가 분석한 일정 및 이동 경로 안내입니다.</p>
    </div>

    <div class="ai-report-content">
        <div th:utext="${reportHtml}"></div>
    </div>

    <script>
        window.onload = () => {
            setTimeout(() => {
                window.print();
            }, 800);
        };
    </script>
</body>
</html>
