<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>여행 플랜 보고서</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
    <style>
        :root {
            --parchment: #f3e8cf;
            --forest: #4b6b4a;
            --ink: #3a2e22;
            --line: #d8c69a;
        }
        body {
            font-family: 'Gowun Dodum', 'Apple SD Gothic Neo', sans-serif;
            color: var(--ink);
            background-color: #ffffff;
            margin: 0;
            padding: 40px;
            line-height: 1.6;
            max-width: 900px;
            margin: 0 auto;
        }
        h1, h2, h3, h4, h5 {
            font-family: 'Jua', 'Gowun Dodum', sans-serif;
            color: var(--forest);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }
        th, td {
            border: 1px solid var(--line);
            padding: 12px;
            text-align: left;
        }
        th {
            background-color: var(--parchment);
            font-weight: bold;
        }
        .ai-report-content {
            padding: 20px;
            border: 2px dashed var(--forest);
            border-radius: 12px;
            background-color: #faf8f2;
        }
        ul, ol {
            padding-left: 20px;
            margin: 10px 0;
        }
        li {
            margin-bottom: 6px;
        }
        b, strong {
            color: #d9a441;
        }
        .header {
            text-align: center;
            border-bottom: 2px solid var(--forest);
            padding-bottom: 20px;
            margin-bottom: 30px;
        }
        @media print {
            body {
                padding: 0;
            }
            .ai-report-content {
                border: none;
                background-color: transparent;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>여행 플랜 경로 리포트</h1>
        <p>AI가 분석한 일정 및 이동 경로 안내입니다.</p>
    </div>

    <div class="ai-report-content">
        <div th:utext="${reportHtml}"></div>
    </div>

    <script>
        window.onload = () => {
            setTimeout(() => {
                window.print();
            }, 800);
        };
    </script>
</body>
</html>
