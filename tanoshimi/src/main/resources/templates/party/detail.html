<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta th:replace="~{fragments/layout :: head(${party.title} + ' | 타노시미')}">
    <style>
      a.back { display:inline-block; text-decoration:none; color:var(--ink-soft); font-size:14px; transition:color .2s; }
      a.back:hover { color:var(--forest); }
    </style>
</head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="wrap" style="max-width:800px; padding:20px;">
  <div style="margin-bottom:16px; display:flex; justify-content:space-between; align-items:center;">
    <a class="back" th:href="@{/party-board}">← [[#{party.back_to_list}]]</a>
    <button type="button" sec:authorize="isAuthenticated()" th:unless="${isOwner}"
            th:attr="data-report-type='party',data-report-id=${party.id},data-report-label=${party.title}"
            style="font-size:12px; color:var(--ink-soft); background:none; border:none; cursor:pointer;">🚨 신고</button>
  </div>

  <div class="party-box" style="background:var(--card); border:1px solid var(--line); border-radius:16px; overflow:hidden;">
    <div style="position:relative; height:200px;"
         th:with="today=${T(java.time.LocalDate).now()}, isRecruitable=${party.status.name() == 'recruiting' and party.departureDate.isAfter(today)}">
      <div th:class="${(party.thumbnailUrl != null and !#strings.startsWith(party.thumbnailUrl,'ph')) ? 'ph1' : (party.thumbnailUrl ?: 'ph1')}"
           style="position:absolute; inset:0;"
           th:styleappend="${(party.thumbnailUrl != null and !#strings.startsWith(party.thumbnailUrl,'ph')) ? 'background-image:url(' + party.thumbnailUrl + '); background-size:cover; background-position:center;' : ''}"></div>

      <div style="position:absolute; top:12px; left:12px; display:flex; gap:6px;">
        <span class="chip chip-region" th:text="'📍 ' + ${party.region}" style="background:var(--sky); color:#1c3a44; font-size:12px; font-weight:700; border-radius:999px; padding:4px 11px; display:inline-block;">지역</span>

        <!-- '모집중'은 status==recruiting 뿐 아니라 출발일이 오늘보다 뒤일 때만 뜬다 - 출발 당일부터는
             신청 자체를 막기로 했으므로(PartyApplicationService.apply) 화면 문구도 그 기준을 따라야
             실제 신청 가능 여부와 어긋나지 않는다. -->
        <span class="chip" th:text="${isRecruitable} ? #{party.status.recruiting} : #{party.status.closed}"
              th:style="${isRecruitable} ? 'font-size:12px; font-weight:700; border-radius:999px; padding:4px 11px; display:inline-block; background:var(--forest);color:#fff;' : 'font-size:12px; font-weight:700; border-radius:999px; padding:4px 11px; display:inline-block; background:#8a7a63;color:#fff;'">상태</span>
      </div>

      <div th:if="${isOwner}" style="position:absolute; bottom:12px; left:12px;">
        <button type="button" class="btn" style="background:rgba(255,255,255,.9); font-size:11px; padding:4px 8px;" onclick="document.getElementById('thumbnail-upload').click()">📷 [[#{party.thumb.change}]]</button>
        <input type="file" id="thumbnail-upload" accept="image/*" style="display:none;" onchange="changeThumbnail()">
      </div>

      <!-- '마감'은 날짜 계산(endDate=departureDate+durationDays) 대신 party.status가 completed
           인지로만 판정한다 - PartyCompletionScheduler가 매일 00:30에 endDate 경과 파티를 completed
           로 바꿔주는데, 날짜만으로 계산하면 자정~00:30 사이엔 "아직 completed 는 아닌데 날짜상으론
           종료"인 상태가 생겨 위 모집상태 칩과 모순될 수 있다. status를 그대로 신뢰하면 두 뱃지가
           항상 같은 정보를 기준으로 삼게 되어 이 레이스도 원천 차단된다. -->
      <span style="position:absolute; bottom:12px; right:12px; background:rgba(58,46,34,.72); color:#fff; font-size:12px; border-radius:999px; padding:4px 10px;"
            th:text="${party.departureDate.isEqual(today) ? 'D-DAY' : (party.departureDate.isAfter(today) ? 'D-' + T(java.time.temporal.ChronoUnit).DAYS.between(today, party.departureDate) : (party.status.name() == 'completed' ? '마감' : '여행중'))}">D-7</span>
    </div>
    
    <div style="padding:20px;">
      <div style="display:flex; justify-content:space-between; align-items:flex-start;">
        <h1 style="font-size:21px; margin:0;" id="party-title" th:text="${party.title}">제목</h1>
        <button type="button" class="btn translate-btn" style="font-size:10px; padding:4px 8px; border:1px solid var(--line); border-radius:4px; cursor:pointer; background:#fff;" onclick="translatePost()">번역 🌍</button>
      </div>

      <p style="color:var(--ink-soft); font-size:13px; margin-top:6px; line-height:1.5;" id="party-desc" th:text="${party.description}">내용</p>

      <div style="margin-top:16px; padding:16px; background:#f9f9f9; border-radius:8px; display:flex; flex-direction:column; gap:8px; font-size:13px;">
        <div style="display:flex; justify-content:space-between;">
          <span>[[#{party.meta.schedule}]] <b th:text="${party.departureDate}">-</b></span>
          <span th:if="${party.budgetKrw != null}">[[#{party.meta.budget}]] <b th:text="${party.budgetKrw} + #{party.meta.budget_approx}">-</b></span>
        </div>
        <div style="display:flex; justify-content:space-between;">
          <span>[[#{party.meta.gender}]] <b th:text="${party.genderRestriction.name() == 'all'} ? #{party.gender.all} : (${party.genderRestriction.name() == 'male_only'} ? #{party.gender.male_only} : #{party.gender.female_only})">-</b></span>
          <span>[[#{party.meta.capacity}]] <b th:text="${party.capacity} + '명'">-</b></span>
        </div>
        <div style="display:flex; justify-content:space-between;">
          <span th:if="${party.ageMin != null or party.ageMax != null}">
            [[#{party.meta.age}]] <b th:text="(${party.ageMin} ?: '') + '~' + (${party.ageMax} ?: '') + #{party.meta.age_range}">-</b>
          </span>
          <span th:if="${party.nationalityRestriction.name() != 'all'}">
            [[#{party.nationality}]] <b th:text="${party.nationalityRestriction.name() == 'kr_only'} ? #{party.nationality.kr_only} : #{party.nationality.jp_only}">-</b>
          </span>
        </div>
      </div>
    </div>
  </div>

  <div style="margin-top:24px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px;">
    <h2 style="font-size:15px; margin-top:0;">[[#{party.apply}]]</h2>
    
    <div th:if="${!eligible and ineligibleReasonKey != null}" style="padding:12px; background:#ffeeee; border:1px solid #ffcccc; color:#cc0000; border-radius:8px; font-size:13px;">
      🚫 <span th:text="#{${ineligibleReasonKey}}">조건에 맞지 않습니다.</span>
    </div>

    <div th:if="${eligible and !isOwner}">
      <div style="margin-bottom:12px;">
        <textarea id="apply-message" maxlength="300" th:placeholder="#{party.apply.placeholder}"
                  style="width:100%; min-height:80px; padding:10px; border:1px solid var(--line); border-radius:8px; font-family:inherit;"></textarea>
      </div>
      <div style="text-align:right;">
        <button type="button" class="btn btn-primary" id="btn-apply"
                th:attr="data-party-id=${party.id}" th:text="#{party.apply}">신청하기</button>
      </div>
    </div>
  </div>
  
</main>
<script th:src="@{/js/csrf.js}"></script>
<script th:inline="javascript">
  const MSG_ERROR = /*[[#{error.general}]]*/ '오류가 발생했습니다.';

  const btnApply = document.getElementById('btn-apply');
  if (btnApply) {
      btnApply.addEventListener('click', async () => {
          const msg = document.getElementById('apply-message').value.trim();
          const partyId = btnApply.dataset.partyId;
          const body = { message: msg };
          
          let csrfToken = document.querySelector('meta[name="_csrf"]')?.content || '';
          let csrfHeader = document.querySelector('meta[name="_csrf_header"]')?.content || 'X-CSRF-TOKEN';
          
          try {
              const res = await fetch(`/api/parties/${partyId}/apply`, {
                  method: 'POST',
                  headers: {
                      'Content-Type': 'application/json',
                      ...(csrfToken ? {[csrfHeader]: csrfToken} : {})
                  },
                  body: JSON.stringify(body)
              });
              const data = await res.json();
              if (data.success) {
                  window.location.href = '/my-parties';
              } else {
                  alert(data.message || MSG_ERROR);
              }
          } catch (e) {
              alert(MSG_ERROR);
          }
      });
  }

  async function translatePost() {
      const titleEl = document.getElementById('party-title');
      const descEl = document.getElementById('party-desc');
      let docLang = document.documentElement.lang;
      const targetLang = docLang === 'ja' ? 'ja' : 'ko';
      try {
          const r1 = await window.api.post('/api/chat/translate', {text: titleEl.textContent, targetLang: targetLang});
          if(r1.success) titleEl.textContent = r1.data;
          const r2 = await window.api.post('/api/chat/translate', {text: descEl.textContent, targetLang: targetLang});
          if(r2.success) descEl.textContent = r2.data;
      } catch(e) {}
  }
  
  if (document.documentElement.lang === 'ja') {
      window.addEventListener('load', () => translatePost());
  }

  async function changeThumbnail() {
      const fileInput = document.getElementById('thumbnail-upload');
      const file = fileInput.files[0];
      if (!file) return;
      const partyId = window.location.pathname.split('/').pop();
      const formData = new FormData();
      formData.append('file', file);
      
      let csrfToken = document.querySelector('meta[name="_csrf"]')?.content || '';
      let csrfHeader = document.querySelector('meta[name="_csrf_header"]')?.content || 'X-CSRF-TOKEN';
      
      try {
          const res = await fetch(`/api/parties/${partyId}/thumbnail`, {
              method: 'POST',
              headers: csrfToken ? {[csrfHeader]: csrfToken} : {},
              body: formData
          });
          const data = await res.json();
          if (data.success) {
              window.location.reload();
          } else {
              alert(data.message || MSG_ERROR);
          }
      } catch (e) {
          alert('오류가 발생했습니다.');
      }
  }
</script>
<div th:replace="~{fragments/layout :: companion}"></div>
</body>
</html>
