<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{party.create} + ' | 타노시미')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="wrap" style="max-width:600px; padding:20px;">
  <div style="margin-bottom:16px;">
    <a class="back" th:href="@{/party-board}" style="text-decoration:none; color:var(--ink-soft); font-size:14px;">← [[#{party.back_to_list}]]</a>
  </div>

  <div style="background:var(--card); border:1px solid var(--line); border-radius:16px; padding:30px;">
    <h1 style="font-size:22px; margin-top:0; color:var(--forest);">[[#{party.create}]]</h1>
    <p style="color:var(--ink-soft); font-size:13.5px; margin-bottom:24px;">새로운 파티를 개설하고 동행을 찾아보세요.</p>

    <form id="create-form" style="display:flex; flex-direction:column; gap:16px;">
      
      <div>
        <label for="title" style="display:block; font-size:13px; font-weight:700; margin-bottom:6px;">제목 <span style="color:#e53935;">*</span></label>
        <input type="text" id="title" maxlength="200" placeholder="예: 오사카 4박5일 먹방투어" style="width:100%; padding:10px; border:1px solid var(--line); border-radius:8px; font-family:inherit;">
      </div>

      <div>
        <label for="description" style="display:block; font-size:13px; font-weight:700; margin-bottom:6px;">소개</label>
        <textarea id="description" maxlength="1000" placeholder="일정, 목표 등을 자유롭게 적어주세요." style="width:100%; min-height:100px; padding:10px; border:1px solid var(--line); border-radius:8px; font-family:inherit;"></textarea>
      </div>

      <div>
        <label for="thumbnail" style="display:block; font-size:13px; font-weight:700; margin-bottom:6px;">대표 사진 <span style="font-weight:400; color:var(--ink-soft);">(선택)</span></label>
        <input type="file" id="thumbnail" accept="image/*" style="display:block; font-size:13px;">
      </div>

      <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
        <div>
          <label for="region" style="display:block; font-size:13px; font-weight:700; margin-bottom:6px;">지역 <span style="color:#e53935;">*</span></label>
          <select id="region" style="width:100%; padding:10px; border:1px solid var(--line); border-radius:8px; font-family:inherit;">
            <option value="">선택</option>
            <option>오사카</option><option>도쿄</option><option>교토</option>
            <option>후쿠오카</option><option>홋카이도</option><option>오키나와</option>
            <option>기타 일본</option>
            <option>서울</option><option>부산</option><option>제주</option>
            <option>기타 한국</option>
          </select>
        </div>
        <div>
          <label for="departureDate" style="display:block; font-size:13px; font-weight:700; margin-bottom:6px;">출발일 <span style="color:#e53935;">*</span></label>
          <input type="date" id="departureDate" style="width:100%; padding:10px; border:1px solid var(--line); border-radius:8px; font-family:inherit;">
        </div>
        <div>
          <label for="durationDays" style="display:block; font-size:13px; font-weight:700; margin-bottom:6px;">여행 일수 <span style="color:#e53935;">*</span></label>
          <input type="number" id="durationDays" min="1" max="30" value="1" placeholder="예: 3"
                 style="width:100%; padding:10px; border:1px solid var(--line); border-radius:8px; font-family:inherit;">
        </div>
      </div>

      <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
        <div>
          <label for="budgetKrw" style="display:block; font-size:13px; font-weight:700; margin-bottom:6px;">1인 예산 <span style="font-weight:400; color:var(--ink-soft);">(만원)</span></label>
          <input type="number" id="budgetKrw" min="0" placeholder="예: 50" style="width:100%; padding:10px; border:1px solid var(--line); border-radius:8px; font-family:inherit;">
        </div>
        <div>
          <label for="capacity" style="display:block; font-size:13px; font-weight:700; margin-bottom:6px;">모집 인원 <span style="color:#e53935;">*</span></label>
          <input type="number" id="capacity" min="2" max="100" placeholder="예: 4" style="width:100%; padding:10px; border:1px solid var(--line); border-radius:8px; font-family:inherit;">
        </div>
      </div>

      <div>
        <label for="styleTag" style="display:block; font-size:13px; font-weight:700; margin-bottom:6px;">테마 태그</label>
        <select id="styleTag" style="width:100%; padding:10px; border:1px solid var(--line); border-radius:8px; font-family:inherit;">
          <option value="">선택 안함</option>
          <option>축제</option><option>먹거리</option><option>문화체험</option>
          <option>액티비티</option><option>힐링</option>
        </select>
      </div>

      <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; padding-top:10px; border-top:1px dashed var(--line);">
        <div>
          <label for="genderRestriction" style="display:block; font-size:12px; font-weight:700; margin-bottom:4px; color:var(--ink-soft);">성별 제한</label>
          <select id="genderRestriction" style="width:100%; padding:8px; border:1px solid var(--line); border-radius:6px; font-size:12px;">
            <option value="all">제한 없음</option>
            <option value="male_only">남자만</option>
            <option value="female_only">여자만</option>
          </select>
        </div>
        <div>
          <label for="nationalityRestriction" style="display:block; font-size:12px; font-weight:700; margin-bottom:4px; color:var(--ink-soft);">국적 제한</label>
          <select id="nationalityRestriction" style="width:100%; padding:8px; border:1px solid var(--line); border-radius:6px; font-size:12px;">
            <option value="all">제한 없음</option>
            <option value="kr_only">한국인만</option>
            <option value="jp_only">일본인만</option>
          </select>
        </div>
        <div style="display:flex; gap:6px;">
          <div style="flex:1;">
            <label for="ageMin" style="display:block; font-size:12px; font-weight:700; margin-bottom:4px; color:var(--ink-soft);">최소 연령</label>
            <input type="number" id="ageMin" min="14" max="99" style="width:100%; padding:8px; border:1px solid var(--line); border-radius:6px; font-size:12px;">
          </div>
          <div style="flex:1;">
            <label for="ageMax" style="display:block; font-size:12px; font-weight:700; margin-bottom:4px; color:var(--ink-soft);">최대 연령</label>
            <input type="number" id="ageMax" min="14" max="99" style="width:100%; padding:8px; border:1px solid var(--line); border-radius:6px; font-size:12px;">
          </div>
        </div>
      </div>

      <button type="button" id="btn-create" class="btn btn-primary" style="width:100%; padding:14px; font-size:15px; margin-top:16px;">파티 만들기</button>
    </form>
  </div>
</main>
<script th:src="@{/js/csrf.js}"></script>
<script>
document.getElementById('btn-create').addEventListener('click', async () => {
    const title = document.getElementById('title').value.trim();
    const region = document.getElementById('region').value;
    const dep = document.getElementById('departureDate').value;
    const duration = document.getElementById('durationDays').value;
    const cap = document.getElementById('capacity').value;

    if(!title || !region || !dep || !cap) {
        alert('필수 항목을 모두 입력해주세요.');
        return;
    }

    const budget = document.getElementById('budgetKrw').value;
    const style = document.getElementById('styleTag').value;
    const aMin = document.getElementById('ageMin').value;
    const aMax = document.getElementById('ageMax').value;
    const file = document.getElementById('thumbnail').files[0];

    let csrfToken = document.querySelector('meta[name="_csrf"]')?.content || '';
    let csrfHeader = document.querySelector('meta[name="_csrf_header"]')?.content || 'X-CSRF-TOKEN';

    try {
        // 사진을 골랐으면 먼저 업로드해서 URL을 받는다 (안 골랐으면 랜덤 기본 이미지로).
        let thumbnailUrl;
        if (file) {
            const fd = new FormData();
            fd.append('file', file);
            const uploadRes = await fetch('/api/uploads/image', {
                method: 'POST',
                headers: csrfToken ? {[csrfHeader]: csrfToken} : {},
                body: fd
            });
            const uploadJson = await uploadRes.json();
            if (!uploadJson.success) { alert(uploadJson.message || '사진 업로드에 실패했습니다.'); return; }
            thumbnailUrl = uploadJson.data;
        } else {
            const thumbs = ['ph1', 'ph2', 'ph3', 'ph4'];
            thumbnailUrl = thumbs[Math.floor(Math.random() * thumbs.length)];
        }

        // 실제 파티 생성 API는 멀티파트가 아니라 JSON body 를 받는다.
        const res = await fetch('/api/parties', {
            method: 'POST',
            headers: Object.assign({'Content-Type': 'application/json'}, csrfToken ? {[csrfHeader]: csrfToken} : {}),
            body: JSON.stringify({
                title,
                description: document.getElementById('description').value,
                region,
                departureDate: dep,
                durationDays: parseInt(duration, 10) || 1,
                capacity: parseInt(cap, 10),
                budgetKrw: budget ? parseInt(budget, 10) : null,
                styleTag: style || null,
                genderRestriction: document.getElementById('genderRestriction').value,
                nationalityRestriction: document.getElementById('nationalityRestriction').value,
                ageMin: aMin ? parseInt(aMin, 10) : null,
                ageMax: aMax ? parseInt(aMax, 10) : null,
                thumbnailUrl,
                tourId: null
            })
        });
        const data = await res.json();
        if (data.success) {
            // data.data 는 새로 만들어진 파티 ID(숫자) 그 자체다.
            window.location.href = `/party-board/${data.data}/room`;
        } else {
            alert(data.message || '오류가 발생했습니다.');
        }
    } catch(err) {
        alert('서버와 통신 중 오류가 발생했습니다.');
    }
});
</script>
<div th:replace="~{fragments/layout :: companion}"></div>
</body>
</html>
