<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta th:replace="~{fragments/layout :: head('관광지 추천 작성')}">
    <style>
        .form-wrap { max-width: 600px; margin: 40px auto; background: #fff; padding: 40px; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.05); }
        .form-wrap h2 { margin: 0 0 30px; font-weight: 900; color: var(--forest); }
        .form-group { margin-bottom: 24px; display: flex; flex-direction: column; gap: 8px; }
        .form-group label { font-weight: 700; color: var(--ink); font-size: 14px; }
        .form-group input[type="text"], .form-group textarea, .form-group select { 
            padding: 12px 16px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; font-family: inherit; transition: 0.2s;
        }
        .form-group input:focus, .form-group textarea:focus { outline: none; border-color: var(--forest); box-shadow: 0 0 0 3px rgba(60,90,58,0.1); }
        .form-group textarea { resize: vertical; min-height: 120px; }
        .form-group input[type="file"] { padding: 10px; border: 1px dashed #ccc; background: #fafafa; border-radius: 8px; }
        
        .submit-btn { width: 100%; background: var(--forest); color: #fff; padding: 14px; border: none; border-radius: 8px; font-size: 16px; font-weight: 800; cursor: pointer; transition: 0.2s; }
        .submit-btn:hover { background: var(--forest-deep); }
    </style>
</head>
<body style="background:var(--parchment); font-family:'Pretendard', sans-serif;">
<header th:replace="~{fragments/layout :: header}"></header>

<div class="form-wrap">
    <h2>📸 숨겨진 명소 추천하기</h2>
    <form th:action="@{/recommendations/write}" method="post" enctype="multipart/form-data">
        <div class="form-group">
            <label>장소 이름</label>
            <input type="text" name="title" required placeholder="예) 교토 아라시야마 대나무숲">
        </div>
        <div class="form-group">
            <label>지역</label>
            <input type="text" name="region" required placeholder="예) 도쿄, 오사카, 홋카이도 등">
        </div>
        <div class="form-group">
            <label>상세 설명</label>
            <textarea name="content" required placeholder="이 장소를 추천하는 이유를 자유롭게 적어주세요."></textarea>
        </div>
        <div class="form-group">
            <label>사진 첨부 (선택)</label>
            <span style="font-size:12px; color:#888;">사진을 첨부하지 않으면 AI가 장소 이름에 맞는 사진을 찾아오거나 기본 사진이 적용됩니다.</span>
            <input type="file" name="image" accept="image/*">
        </div>
        <button type="submit" class="submit-btn">추천 등록하기</button>
    </form>
</div>
</body>
</html>
