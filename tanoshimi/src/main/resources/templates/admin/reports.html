<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('신고 처리 | 관리자')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="wrap">

  <div style="margin-bottom: 20px; display:flex; gap: 10px;">
    <a href="/admin" class="btn" style="background:#fff; border:1px solid #ccc;">회원 관리</a>
    <a href="/admin/parties" class="btn" style="background:#fff; border:1px solid #ccc;">파티 게시글 관리</a>    <a href="/admin/banners" class="btn" style="background:#fff; border:1px solid #ccc;">광고 배너 관리</a>
    <a href="/admin/reports" class="btn btn-primary">신고 처리</a>
  </div>

  <h1 style="font-size:22px; margin:0 0 4px;">신고 처리</h1>
  <p style="font-size:13px; color:var(--ink-soft); margin:0 0 16px;">대기 중인 신고 목록입니다. 처리하면 목록에서 사라집니다.</p>

  <table style="width:100%; border-collapse:collapse; font-size:13px;">
    <thead>
    <tr style="background:var(--parchment-deep);">
      <th style="padding:9px; text-align:left;">신고일</th>
      <th style="padding:9px; text-align:left;">신고자</th>
      <th style="padding:9px; text-align:left;">종류</th>
      <th style="padding:9px; text-align:left;">대상</th>
      <th style="padding:9px; text-align:left;">사유</th>
      <th style="padding:9px; text-align:left;">처리</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="r : ${reports.content}" style="border-bottom:1px solid var(--line); vertical-align:top;">
      <td style="padding:9px; white-space:nowrap;" th:text="${#temporals.format(r.createdAt, 'yyyy-MM-dd HH:mm')}">2026-01-01</td>
      <td style="padding:9px; white-space:nowrap;" th:text="${r.reporter.name}">신고자</td>
      <td style="padding:9px;">
        <span th:text="${r.targetType.name() == 'post' ? '게시글' : (r.targetType.name() == 'party' ? '파티' : '사용자')}"
              style="background:var(--parchment-deep); border-radius:4px; padding:2px 8px; font-size:11.5px;">종류</span>
      </td>
      <td style="padding:9px; max-width:220px;">
        <a th:if="${r.targetType.name() == 'post'}" th:href="@{'/board/' + ${r.targetId}}" target="_blank"
           th:text="${r.targetLabel}" style="color:var(--forest); font-weight:700;">대상</a>
        <a th:if="${r.targetType.name() == 'party'}" th:href="@{'/party-board/' + ${r.targetId}}" target="_blank"
           th:text="${r.targetLabel}" style="color:var(--forest); font-weight:700;">대상</a>
        <a th:if="${r.targetType.name() == 'user'}" th:href="@{'/users/' + ${r.targetId}}" target="_blank"
           th:text="${r.targetLabel}" style="color:var(--forest); font-weight:700;">대상</a>
      </td>
      <td style="padding:9px; max-width:280px; word-break:break-word;" th:text="${r.reason}">사유</td>
      <td style="padding:9px; white-space:nowrap;">
        <form th:action="@{'/admin/reports/' + ${r.id} + '/resolve'}" method="post" style="display:inline;">
          <button type="submit" class="btn" style="background:var(--forest); color:#fff; font-size:11px; padding:5px 10px;">조치완료</button>
        </form>
        <form th:action="@{'/admin/reports/' + ${r.id} + '/dismiss'}" method="post" style="display:inline;">
          <button type="submit" class="btn" style="background:#fff; border:1px solid var(--line); font-size:11px; padding:5px 10px;">기각</button>
        </form>
      </td>
    </tr>
    <tr th:if="${#lists.isEmpty(reports.content)}">
      <td colspan="6" style="padding:40px; text-align:center; color:var(--ink-soft);">대기 중인 신고가 없습니다.</td>
    </tr>
    </tbody>
  </table>

  <div style="display:flex; gap:6px; margin-top:16px; justify-content:center;" th:if="${reports.totalPages > 1}">
    <a th:each="i : ${#numbers.sequence(0, reports.totalPages - 1)}"
       th:href="@{/admin/reports(page=${i})}" th:text="${i + 1}"
       th:classappend="${i == reports.number} ? 'on'"
       style="width:30px; height:30px; display:flex; align-items:center; justify-content:center; border:1px solid var(--line); border-radius:6px; font-size:12px;">1</a>
  </div>
</main>
<div th:replace="~{fragments/layout :: companion}"></div>
</body>
</html>
