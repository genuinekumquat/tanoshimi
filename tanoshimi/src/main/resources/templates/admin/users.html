<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('회원 관리 | 관리자')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="wrap">
  
  <div style="margin-bottom: 20px; display:flex; gap: 10px;">
    <a href="/admin" class="btn btn-primary">회원 관리</a>
    <a href="/admin/parties" class="btn" style="background:#fff; border:1px solid #ccc;">파티 게시글 관리</a>    <a href="/admin/banners" class="btn" style="background:#fff; border:1px solid #ccc;">광고 배너 관리</a>
    <a href="/admin/reports" class="btn" style="background:#fff; border:1px solid #ccc; position:relative;">
      신고 처리
      <span th:if="${pendingReportCount != null and pendingReportCount > 0}" th:text="${pendingReportCount}"
            style="position:absolute; top:-8px; right:-8px; background:var(--danger); color:#fff; border-radius:999px; font-size:10px; padding:1px 6px; font-weight:700;"></span>
    </a>
  </div>

  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
      <h1 style="font-size:22px; margin:0;">회원 관리 <small style="font-size:13px; color:var(--ink-soft); font-weight:400;"
          th:text="'(' + ${adminName} + ' 관리자)'">()</small></h1>
      <form method="get" action="/admin" style="display:flex; gap:6px;">
          <input type="text" name="keyword" th:value="${keyword}" placeholder="이름 또는 이메일 검색" style="padding:6px; border:1px solid #ccc; border-radius:4px;">
          <button type="submit" class="btn btn-primary" style="padding:6px 12px;">검색</button>
      </form>
  </div>

  <table style="width:100%; border-collapse:collapse; margin-top:16px; font-size:13px;">
    <thead>
    <tr style="background:var(--parchment-deep);">
      <th style="padding:9px; text-align:left;">ID</th>
      <th style="padding:9px; text-align:left;">이메일</th>
      <th style="padding:9px; text-align:left;">이름</th>
      <th style="padding:9px; text-align:left;">가입경로</th>
      <th style="padding:9px; text-align:left;">국적</th>
      <th style="padding:9px; text-align:left;">권한</th>
      <th style="padding:9px; text-align:left;">상태</th>
      <th style="padding:9px; text-align:left;">관리</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="user : ${users.content}" style="border-bottom:1px solid var(--line);">
      <td style="padding:9px;" th:text="${user.id}">1</td>
      <td style="padding:9px;" th:text="${user.email}">a@b.com</td>
      <td style="padding:9px;" th:text="${user.name}">홍길동</td>
      <td style="padding:9px;" th:text="${user.socialProvider} ?: '이메일'">이메일</td>
      <td style="padding:9px;" th:text="${user.nationality}">KR</td>
      <td style="padding:9px;" th:text="${user.role}">USER</td>
      <td style="padding:9px;" th:text="${user.status}">ACTIVE</td>
      <td style="padding:9px;">
        
        <form th:if="${user.status.name() == 'active'}"
              th:action="@{'/admin/users/' + ${user.id} + '/suspend'}" method="post" style="display:inline-flex; gap: 4px; align-items:center;">
          <select name="duration" style="padding:4px; font-size:11px; border:1px solid var(--line); border-radius:4px;">
              <option value="1">24시간</option>
              <option value="3">3일</option>
              <option value="7">7일</option>
              <option value="30">30일</option>
              <option value="365">365일</option>
              <option value="999">영구</option>
          </select>
          <button type="submit" class="btn" style="background:#fff; border:1px solid var(--line); font-size:11px; padding:5px 10px;">정지</button>
        </form>

        <form th:if="${user.status.name() == 'suspended'}"
              th:action="@{'/admin/users/' + ${user.id} + '/activate'}" method="post" style="display:inline;">
          <button type="submit" class="btn btn-primary" style="font-size:11px; padding:5px 10px;">복구</button>
        </form>
      
        <form th:if="${user.role.name() == 'user'}"
              th:action="@{'/admin/users/' + ${user.id} + '/grant-admin'}" method="post" style="display:inline-flex;">
          <button type="submit" class="btn btn-primary" style="font-size:11px; padding:5px 10px; margin-left:6px;">관리자 부여</button>
        </form>
        <form th:if="${user.role.name() == 'admin'}"
              th:action="@{'/admin/users/' + ${user.id} + '/revoke-admin'}" method="post" style="display:inline-flex;">
          <button type="submit" class="btn" style="background:#fff; border:1px solid var(--danger); color:var(--danger); font-size:11px; padding:5px 10px; margin-left:6px;">관리자 해제</button>
        </form>
      </td>
    </tr>
    </tbody>
  </table>

  <div style="display:flex; gap:6px; margin-top:16px; justify-content:center;" th:if="${users.totalPages > 1}">
    <a th:each="i : ${#numbers.sequence(0, users.totalPages - 1)}"
       th:href="@{/admin(page=${i},keyword=${keyword})}"
       th:text="${i + 1}"
       th:classappend="${i == users.number} ? 'on'"
       style="width:30px; height:30px; display:flex; align-items:center; justify-content:center; border:1px solid var(--line); border-radius:6px; font-size:12px;">1</a>
  </div>
</main>
<div th:replace="~{fragments/layout :: companion}"></div>
</body>
</html>
