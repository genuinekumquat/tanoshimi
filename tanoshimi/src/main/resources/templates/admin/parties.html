<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('파티 관리 | 관리자')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="wrap">
  
  <div style="margin-bottom: 20px; display:flex; gap: 10px;">
    <a href="/admin" class="btn" style="background:#fff; border:1px solid #ccc;">회원 관리</a>
    <a href="/admin/parties" class="btn btn-primary">파티 게시글 관리</a>    <a href="/admin/banners" class="btn" style="background:#fff; border:1px solid #ccc;">광고 배너 관리</a>
    <a href="/admin/reports" class="btn" style="background:#fff; border:1px solid #ccc;">신고 처리</a>
  </div>

  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
      <h1 style="font-size:22px; margin:0;">파티 게시글 관리</h1>
      <form method="get" action="/admin/parties" style="display:flex; gap:6px;">
          <input type="text" name="keyword" th:value="${keyword}" placeholder="파티 제목 검색" style="padding:6px; border:1px solid #ccc; border-radius:4px;">
          <button type="submit" class="btn btn-primary" style="padding:6px 12px;">검색</button>
      </form>
  </div>

  <table style="width:100%; border-collapse:collapse; margin-top:16px; font-size:13px;">
    <thead>
    <tr style="background:var(--parchment-deep);">
      <th style="padding:9px; text-align:left;">ID</th>
      <th style="padding:9px; text-align:left;">작성자</th>
      <th style="padding:9px; text-align:left;">지역</th>
      <th style="padding:9px; text-align:left;">제목</th>
      <th style="padding:9px; text-align:left;">등록일</th>
      <th style="padding:9px; text-align:left;">참여인원</th>
      <th style="padding:9px; text-align:left;">상태</th>
      <th style="padding:9px; text-align:left;">관리</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="party : ${parties.content}" style="border-bottom:1px solid var(--line);">
      <td style="padding:9px;" th:text="${party.id}">1</td>
      <td style="padding:9px;" th:text="${party.owner != null ? party.owner.name : '알수없음'}">작성자</td>
      <td style="padding:9px;" th:text="${party.region}">지역</td>
      <td style="padding:9px;">
        <a th:href="@{'/party-board/' + ${party.id}}" target="_blank" th:text="${party.title}" style="color:var(--forest); font-weight:700;">파티 제목</a>
      </td>
      <td style="padding:9px;" th:text="${party.createdAt != null ? #temporals.format(party.createdAt, 'yyyy-MM-dd') : ''}">2026-01-01</td>
      <td style="padding:9px;" th:text="'- / ' + ${party.capacity}">- / 4</td>
      <td style="padding:9px;" th:text="${party.status}">RECRUITING</td>
      <td style="padding:9px;">
        <form th:if="${party.status.name() != 'closed'}"
              th:action="@{'/admin/parties/' + ${party.id} + '/close'}" method="post" style="display:inline;">
          <button type="submit" class="btn" style="background:#fff; border:1px solid var(--line); font-size:11px; padding:5px 10px;">글 내림(강제 종료)</button>
        </form>
      </td>
    </tr>
    </tbody>
  </table>

  <div style="display:flex; gap:6px; margin-top:16px; justify-content:center;" th:if="${parties.totalPages > 1}">
    <a th:each="i : ${#numbers.sequence(0, parties.totalPages - 1)}"
       th:href="@{/admin/parties(page=${i},keyword=${keyword})}" th:text="${i + 1}"
       th:classappend="${i == parties.number} ? 'on'"
       style="width:30px; height:30px; display:flex; align-items:center; justify-content:center; border:1px solid var(--line); border-radius:6px; font-size:12px;">1</a>
  </div>
</main>
</body>
</html>
