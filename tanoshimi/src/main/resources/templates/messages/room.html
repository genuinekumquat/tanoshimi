<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${otherUserName} + ' - 쪽지 | 타노시미')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="wrap" style="max-width:600px;">
  <a th:href="@{/messages}" style="font-size:13px; color:var(--ink-soft);">← 쪽지함으로</a>

  <div class="card" style="padding:0; display:flex; flex-direction:column; height:70vh; margin-top:12px;">
    <div style="padding:12px 14px; border-bottom:1px solid var(--line); font-weight:700; font-size:14px;"
         th:text="${otherUserName}">상대방</div>

    <div id="chat-log" style="flex:1; overflow:auto; padding:12px; display:flex; flex-direction:column; gap:8px;">
      <div th:each="m : ${chatHistory}" class="chat-msg" th:attr="data-original=${m.content}">
        <b th:text="${m.senderName}" style="font-size:11.5px;"></b>
        <span style="font-size:11px; color:var(--ink-soft);" th:text="${m.createdAt}"></span>
        <div class="chat-content" th:text="${m.content}">메시지</div>
        <button type="button" class="btn translate-btn" style="font-size:10px; padding:2px 8px; margin-top:2px;">번역</button>
      </div>
    </div>

    <div style="padding:10px; border-top:1px solid var(--line); display:flex; gap:8px;">
      <input type="text" id="chat-input" placeholder="메시지를 입력하세요" style="flex:1; padding:9px; border:1px solid var(--line); border-radius:999px;">
      <button type="button" id="btn-chat-send" class="btn btn-primary" style="border-radius:50%; width:38px;">➤</button>
    </div>
  </div>
</main>

<script th:inline="javascript">
/*<![CDATA[*/
const ROOM_ID = /*[[${roomId}]]*/ 1;
const MY_LANG = /*[[${#locale.language}]]*/ 'ko';
/*]]>*/
</script>
<script th:src="@{/vendor/sockjs.min.js}"></script>
<script th:src="@{/vendor/stomp.min.js}"></script>
<script th:src="@{/js/dm-room.js}" defer></script>
<div th:replace="~{fragments/layout :: companion}"></div>
</body>
</html>
