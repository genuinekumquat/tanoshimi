<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('내 예약 | 타노시미')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="wrap" style="max-width:680px;">
  <h1 style="font-size:22px;">내 예약</h1>
  <p style="color:var(--ink-soft); font-size:13px;">지금까지 예약한 패키지와 결제 상태입니다.</p>

  <div style="display:flex; flex-direction:column; gap:12px; margin-top:16px;">
    <div th:each="r : ${reservations}" class="card" style="display:flex; gap:14px; padding:14px; align-items:center;">
      <a th:href="@{'/reservations/' + ${r.reservationId}}" style="display:flex; gap:14px; flex:1; min-width:0; text-decoration:none; color:inherit; align-items:center;">
        <div style="position:relative; width:72px; height:72px; border-radius:10px; flex:none; overflow:hidden;">
          <div th:class="${(r.tourThumbnail != null and #strings.startsWith(r.tourThumbnail,'/uploads/')) ? 'ph1' : (r.tourThumbnail ?: 'ph1')}"
               style="position:absolute; inset:0;"></div>
          <img th:if="${r.tourThumbnail != null and #strings.startsWith(r.tourThumbnail,'/uploads/')}"
               th:src="@{${r.tourThumbnail}}" onerror="this.style.display='none';"
               style="position:absolute; inset:0; width:100%; height:100%; object-fit:cover;">
        </div>
        <div style="flex:1; min-width:0;">
          <p style="font-weight:700; font-size:14px; margin:0 0 4px;" th:text="${r.tourTitle}">패키지명</p>
          <div style="font-size:11.5px; color:var(--ink-soft); display:flex; gap:8px; flex-wrap:wrap;">
            <span th:text="'📍 ' + ${r.region}"></span>
            <span th:text="'🗓️ ' + ${r.departureDate}"></span>
          </div>
        </div>
      </a>
      <div style="text-align:right; flex:none;">
        <span th:text="${r.status == 'confirmed' ? '✅ 확정' : (r.status == 'cancelled' ? '❌ 취소' : '⏳ 대기중')}"
              style="font-size:12px; font-weight:700; display:block; margin-bottom:6px;">상태</span>
        <span th:if="${r.myPaymentAmount != null and r.myPaymentStatus == 'paid'}"
              style="font-size:11px; color:var(--ink-soft);">결제완료</span>
        <button type="button" th:if="${r.myPaymentAmount != null and r.myPaymentStatus != 'paid'}"
                class="btn btn-primary btn-pay-reservation" th:attr="data-reservation-id=${r.reservationId}"
                style="font-size:11px; padding:7px 12px;"
                th:text="'결제하기 · ' + (${r.myPaymentCurrency == 'JPY'} ? '¥' : '₩') + ${r.myPaymentAmount}">결제하기</button>
      </div>
    </div>

    <div th:if="${#lists.isEmpty(reservations)}" class="card" style="padding:40px; text-align:center; color:var(--ink-soft);">
      아직 예약한 패키지가 없습니다.
      <a th:href="@{/packages}" class="btn btn-primary" style="display:inline-block; margin-top:10px; padding:8px 16px;">패키지 둘러보기</a>
    </div>
  </div>
</main>

<script th:src="@{/js/reservation-pay.js}" defer></script>
</body>
</html>
