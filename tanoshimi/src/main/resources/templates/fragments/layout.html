<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(pageTitle)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}" th:if="${_csrf != null}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}" th:if="${_csrf != null}"/>
    <title th:text="${pageTitle != null ? pageTitle + ' - Tanoshimi' : 'Tanoshimi'}">Tanoshimi</title>

    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard-dynamic-subset.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">

    <!-- CSP 통신(인라인 스크립트 대응)을 위한 함수 구조 -->
    <script>
        window.api = {
            async get(url) {
                try {
                    const r = await fetch(url);
                    return await r.json();
                } catch(e) { return {success:false, message:'Network Error'}; }
            },
            async post(url, data) {
                const csrfToken = document.querySelector('meta[name="_csrf"]')?.content;
                const csrfHeader = document.querySelector('meta[name="_csrf_header"]')?.content;
                const headers = { 'Content-Type': 'application/json' };
                if(csrfToken && csrfHeader) headers[csrfHeader] = csrfToken;

                try {
                    const r = await fetch(url, {
                        method: 'POST',
                        headers: headers,
                        body: JSON.stringify(data)
                    });
                    return await r.json();
                } catch(e) { return {success:false, message:'Network Error'}; }
            },
            async patch(url, data={}) {
                const csrfToken = document.querySelector('meta[name="_csrf"]')?.content;
                const csrfHeader = document.querySelector('meta[name="_csrf_header"]')?.content;
                const headers = { 'Content-Type': 'application/json' };
                if(csrfToken && csrfHeader) headers[csrfHeader] = csrfToken;
                try {
                    const r = await fetch(url, { method: 'PATCH', headers: headers, body: JSON.stringify(data) });
                    return await r.json();
                } catch(e) { return {success:false, message:'Network Error'}; }
            },
            async del(url) {
                const csrfToken = document.querySelector('meta[name="_csrf"]')?.content;
                const csrfHeader = document.querySelector('meta[name="_csrf_header"]')?.content;
                const headers = {};
                if(csrfToken && csrfHeader) headers[csrfHeader] = csrfToken;
                try {
                    const r = await fetch(url, { method: 'DELETE', headers: headers });
                    return await r.json();
                } catch(e) { return {success:false, message:'Network Error'}; }
            }
        };
    </script>
    <script th:src="@{/js/report.js}" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <script th:src="@{/js/notifications.js}" defer></script>

    <!-- ================= 여행 도우미 마스코트 위젯 (Live2D) ================= -->
    <script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/dylanNew/live2d/webgl/Live2D/lib/live2d.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pixi.js@6.5.2/dist/browser/pixi.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display/dist/index.min.js"></script>
</head>

<!-- ============================================== -->
<!-- 💡 여행 도우미 위젯 UI (우측 하단 고정) 💡 -->
<!-- ============================================== -->
<div th:fragment="companion" id="companion-widget-container" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 9999; pointer-events: none;">

    <!-- 1. 채팅 패널 (캐릭터 왼쪽에 표시됨) -->
    <div id="companion-chat-panel" style="display: none; position: fixed; right: 300px; bottom: 20px; width: 450px; height: 600px; background: #f0f2f5; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.2); flex-direction: column; overflow: hidden; pointer-events: auto;">

        <!-- 패널 상단 타이틀바 -->
        <div id="companion-chat-drag-handle" style="background: var(--forest, #4A6741); color: white; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; font-weight: bold; cursor: grab;">
            <span>🎒 비비안과 여행 계획 짜기</span>
            <div style="display: flex; align-items: center; gap: 12px;">
                <button id="companion-chat-clear" title="대화 기록 초기화" style="background: none; border: none; color: white; font-size: 13px; cursor: pointer; text-decoration: underline;">초기화</button>
                <button id="companion-chat-close" style="background: none; border: none; color: white; font-size: 18px; cursor: pointer;">✖</button>
            </div>
        </div>
        
        <!-- 컨트롤바 (크기 조절, 표정 변경) -->
        <div style="padding: 8px 12px; background: #e9ecef; border-bottom: 1px solid #ddd; display: flex; flex-direction: column; gap: 8px; font-size: 12px; color: #333;">
            <div style="display: flex; align-items: center; gap: 8px;">
                <span style="font-weight: bold; white-space: nowrap;">크기 조절</span>
                <input type="range" id="companion-scale-slider" min="0.5" max="2.0" step="0.1" value="1.0" style="flex: 1; accent-color: var(--forest, #4A6741);">
                <span id="companion-scale-val" style="width: 30px; text-align: right;">1.0</span>
            </div>
            <div style="display: flex; align-items: center; gap: 8px;">
                <span style="font-weight: bold; white-space: nowrap;">캐릭터 표정</span>
                <div id="companion-expr-btns" style="display: flex; gap: 5px; flex-wrap: wrap;">
                    <button data-expr="normal" style="padding: 4px 8px; font-size: 11px; border: 1px solid #ccc; background: white; border-radius: 4px; cursor: pointer;">기본</button>
                    <button data-expr="happy" style="padding: 4px 8px; font-size: 11px; border: 1px solid #ccc; background: white; border-radius: 4px; cursor: pointer;">기쁨</button>
                    <button data-expr="sad" style="padding: 4px 8px; font-size: 11px; border: 1px solid #ccc; background: white; border-radius: 4px; cursor: pointer;">슬픔</button>
                    <button data-expr="angry" style="padding: 4px 8px; font-size: 11px; border: 1px solid #ccc; background: white; border-radius: 4px; cursor: pointer;">화남</button>
                    <button data-expr="shy" style="padding: 4px 8px; font-size: 11px; border: 1px solid #ccc; background: white; border-radius: 4px; cursor: pointer;">부끄럼</button>
                    <!-- 구분선 -->
                    <div style="width: 1px; background: #ccc; margin: 0 4px;"></div>
                    <button id="companion-ghost-btn" style="padding: 4px 8px; font-size: 11px; border: 1px solid #ccc; background: #ffeb3b; border-radius: 4px; cursor: pointer; font-weight: bold;">👻 숨기기</button>
                      <div style="width: 1px; background: #ccc; margin: 0 4px;"></div>
                      <label style="cursor:pointer; display:flex; align-items:center; gap:4px; font-weight:bold; color:var(--forest, #4A6741); margin-left:auto;"><input type="checkbox" id="companion-show-bot-chat"> 채팅방 출력 ✏️</label>
                </div>
            </div>
        </div>

        <!-- 대화 내역 공간 -->
        <div id="companion-chat-log" style="flex: 1; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px;">
            <!-- 말풍선이 여기에 JS로 생성됨 -->
        </div>

        <!-- 입력창 -->
        <div style="padding: 12px; background: white; border-top: 1px solid #ddd; display: flex; gap: 8px;">
            <input type="text" id="companion-chat-input" placeholder="비비안에게 물어보세요!" style="flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 8px; outline: none;">
            <button id="companion-chat-send" style="background: var(--forest, #4A6741); color: white; border: none; padding: 10px 16px; border-radius: 8px; cursor: pointer; font-weight: bold; flex-shrink: 0; white-space: nowrap;">전송</button>
        </div>
    </div>

        <!-- 2. 캐릭터 캔버스 -->
    <button id="companion-chat-open" style="pointer-events: auto; position: fixed; right: 40px; bottom: 40px; padding: 12px 24px; background: var(--forest, #4A6741); color: white; border: 2px solid white; border-radius: 30px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 16px rgba(0,0,0,0.3); font-size: 15px; transition: all 0.2s; z-index: 10000;">💬 대화하기</button>
        <div id="companion-character-wrap" style="position: fixed; right: 180px; bottom: 20px; width: 240px; height: 320px; display: flex; flex-direction: column; justify-content: flex-end; align-items: flex-end; pointer-events: none; z-index:9999;">
        <div id="companion-speech-bubble" style="display: none; position: absolute; right: calc(200px * var(--vivian-scale, 1)); bottom: calc(230px * var(--vivian-scale, 1)); transform: scale(var(--vivian-scale, 1)); transform-origin: bottom right; background: #fdf5ff; padding: 14px 20px; border-radius: 20px; border: 2px solid #d4a9f0; color: #5a3c6a; box-shadow: 0 8px 24px rgba(0,0,0,0.15); width: 250px; max-height: 150px; overflow-y: auto; font-size: 14px; font-weight: 700; z-index: 10001; word-break: keep-all; pointer-events: auto;"></div>
        <canvas id="companion-canvas" style="pointer-events: auto; cursor: grab; filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.2)); transition: filter 0.2s;"></canvas>
    </div>

    <script src="/js/companion-widget.js?v=9999999"></script>
</div>

<header th:fragment="header" style="position:sticky; top:0; z-index:999; background:rgba(255,255,255,0.95); backdrop-filter:blur(8px); border-bottom:1px solid #eaeaea; padding:12px 20px;">
    <div style="max-width:1200px; margin:0 auto; display:flex; justify-content:space-between; align-items:center;">
        <!-- Left Side: Logo & Main Nav -->
        <div style="display:flex; align-items:center; gap:40px;">
            <a th:href="@{/}" style="font-size:24px; font-weight:900; color:var(--forest); text-decoration:none; letter-spacing:-0.5px;">TANOSHIMI</a>
            <nav style="display:flex; gap:24px; font-weight:700; font-size:15px;" class="hide-mobile">
                <a th:href="@{/recommendations}" style="color:var(--ink); text-decoration:none;">관광지 추천</a>
                <a th:href="@{/party-board}" style="color:var(--ink); text-decoration:none;">파티 게시판</a>
                <a th:href="@{/my-parties}" sec:authorize="isAuthenticated()" style="color:var(--ink); text-decoration:none;">내 파티</a>
            </nav>
        </div>

        <!-- Right Side -->
        <div style="display:flex; align-items:center; gap:20px;">
            <!-- 언어 변경 -->
            <div style="display:flex; align-items:center; gap:8px; font-weight:700; font-size:14px; background:#f4f5f7; padding:4px 8px; border-radius:8px;">
                <a th:href="@{''(lang=ko)}" th:style="${#locale.language == 'ko' or #locale.language == null} ? 'color:var(--forest);' : 'color:var(--ink-soft); text-decoration:none;'">KO</a>
                <span style="color:#ccc;">|</span>
                <a th:href="@{''(lang=ja)}" th:style="${#locale.language == 'ja'} ? 'color:var(--forest);' : 'color:var(--ink-soft); text-decoration:none;'">JP</a>
            </div>

            <th:block sec:authorize="!isAuthenticated()">
                <a th:href="@{/login}" class="btn" style="padding:8px 16px; font-size:14px; background:var(--forest); color:#fff; border-radius:8px; text-decoration:none;">로그인</a>
            </th:block>

            <th:block sec:authorize="isAuthenticated()">
                <!-- 프로필사진 + 닉네임 + 드롭다운 -->
                <div style="position:relative;" id="profile-menu-wrap">
                    <div style="display:flex; align-items:center; gap:8px; cursor:pointer;" id="profile-btn">
                        <img th:if="${#authentication.principal.profileImageUrl != null}" th:src="${#authentication.principal.profileImageUrl}"
                             style="width:36px; height:36px; border-radius:50%; object-fit:cover; border:1px solid #ddd;">
                        <div th:if="${#authentication.principal.profileImageUrl == null}"
                             style="width:36px; height:36px; border-radius:50%; background:#dceef2; color:#3c5a3a; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:16px; border:1px solid #ddd;"
                             th:text="${#strings.substring(#authentication.principal.displayName,0,1)}"></div>
                        <span style="font-size:14.5px; font-weight:700; color:var(--ink);" th:text="${#authentication.principal.displayName}">닉네임</span>
                    </div>

                    <div id="profile-dropdown" style="display:none; position:absolute; top:50px; right:0; background:#fff; border:1px solid #ddd; border-radius:12px; box-shadow:0 8px 24px rgba(0,0,0,0.12); width:160px; z-index:1000; overflow:hidden;">
                        <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin}" style="display:block; padding:12px 16px; font-size:14px; color:var(--danger); font-weight:700; text-decoration:none; transition:background 0.2s;" onmouseover="this.style.background='#fff4f4'" onmouseout="this.style.background='none'">👑 관리자 메뉴</a>
                        <a th:href="@{/mypage}" style="display:block; padding:12px 16px; font-size:14px; color:var(--ink); text-decoration:none; transition:background 0.2s;" onmouseover="this.style.background='#f9f9f9'" onmouseout="this.style.background='none'">마이페이지</a>
                        <a th:href="@{/mypage/account}" style="display:block; padding:12px 16px; font-size:14px; color:var(--ink); text-decoration:none; transition:background 0.2s; border-top:1px solid #f0f0f0;" onmouseover="this.style.background='#f9f9f9'" onmouseout="this.style.background='none'">계정 관리</a>
                        <form th:action="@{/logout}" method="post" style="margin:0;">
                            <button type="submit" style="width:100%; text-align:left; padding:12px 16px; font-size:14px; color:var(--danger); background:none; border:none; border-top:1px solid #f0f0f0; cursor:pointer;" onmouseover="this.style.background='#fff4f4'" onmouseout="this.style.background='none'">로그아웃</button>
                        </form>
                    </div>
                </div>

                <!-- 알림 창 -->
                <div class="notif-wrap" style="position:relative;">
                    <span class="notif-bell" id="top-notif-bell" style="cursor:pointer; font-size:20px; display:flex; align-items:center;">
                        🔔
                        <span class="notif-badge" id="top-notif-badge" style="display:flex; justify-content:center; align-items:center; position:absolute; top:-6px; right:-6px; background:#ff4757; color:#fff; font-size:11px; font-weight:bold; width:18px; height:18px; border-radius:50%;">0</span>
                    </span>
                    <div class="notif-dropdown" id="top-notif-dropdown" style="display:none; position:absolute; top:42px; right:0; background:#fff; border:1px solid #ddd; border-radius:12px; box-shadow:0 8px 30px rgba(0,0,0,0.15); width:320px; z-index:1000; overflow:hidden;">
                        <div style="padding:14px 16px; font-weight:800; font-size:15px; border-bottom:1px solid #f0f0f0; display:flex; justify-content:space-between; align-items:center;">
                            신규 알림
                        </div>
                        <div class="notif-list" id="top-notif-list" style="max-height:350px; overflow-y:auto; padding:0;">
                            <p class="notif-empty" style="text-align:center; font-size:13px; color:#999; padding:40px 0; margin:0;">새로운 알림이 없습니다.</p>
                        </div>
                    </div>
                </div>
            </th:block>

            <!-- 햄버거 메뉴 -->
            <button id="sidebar-toggle-btn" style="background:none; border:none; font-size:26px; cursor:pointer; color:var(--ink); display:flex; align-items:center;">☰</button>
        </div>
    </div>
    <!-- 임시 비밀번호로 로그인한 경우 강제 비밀번호 변경 모달 (비밀번호 재발급 워크플로우).
         닫기/취소 버튼이 없다 - 바꾸기 전까지는 어떤 페이지를 가든 다시 뜬다. -->
    <th:block sec:authorize="isAuthenticated()">
     <th:block th:if="${#authentication.principal.mustChangePassword}">
      <div id="force-pwd-overlay"
           style="position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:100000; display:flex; align-items:center; justify-content:center; padding:20px;">
        <div style="background:#fff; width:100%; max-width:400px; border-radius:20px; padding:28px; display:flex; flex-direction:column; gap:14px; box-shadow:0 20px 50px rgba(0,0,0,.25); box-sizing:border-box;">
          <div>
            <h3 style="margin:0 0 6px; font-size:18px; font-weight:800; color:var(--ink);">비밀번호를 변경해 주세요</h3>
            <p style="margin:0; font-size:12.5px; color:var(--ink-soft); line-height:1.5;">임시 비밀번호로 로그인하셨어요. 계속 이용하시려면 새 비밀번호로 바꿔 주세요.</p>
          </div>
          <div class="fp-field">
            <label>현재 비밀번호</label>
            <input type="password" id="fp-current">
          </div>
          <div class="fp-field">
            <label>새 비밀번호</label>
            <input type="password" id="fp-new" placeholder="8~20자, 영문/숫자/특수문자 중 2가지 이상">
            <p class="fp-msg" id="fp-msg-new"></p>
          </div>
          <div class="fp-field">
            <label>비밀번호 확인</label>
            <input type="password" id="fp-confirm">
            <p class="fp-msg" id="fp-msg-confirm"></p>
          </div>
          <p class="fp-msg" id="fp-msg-form" style="color:var(--danger);"></p>
          <button type="button" id="fp-submit" class="btn btn-primary" style="width:100%; padding:12px;">비밀번호 변경</button>
        </div>
      </div>
      <style>
        .fp-field label{ display:block; font-size:12.5px; font-weight:700; margin-bottom:5px; color:var(--ink); }
        .fp-field input{ width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:8px; font-family:inherit; box-sizing:border-box; }
        .fp-msg{ min-height:16px; font-size:11.5px; margin:4px 0 0; }
        .fp-msg.success{ color:var(--forest); }
        .fp-msg.error{ color:var(--danger); }
      </style>
      <script th:src="@{/js/force-password-change.js}" defer></script>
     </th:block>
    </th:block>

    <!-- 우측 슬라이드 메뉴 -->
    <div id="right-sidebar" style="position:fixed; top:0; right:-320px; width:300px; height:100vh; background:#fff; box-shadow:-8px 0 30px rgba(0,0,0,0.1); z-index:99999; transition:right 0.3s cubic-bezier(0.4, 0.0, 0.2, 1); display:flex; flex-direction:column;">
        <div style="padding:20px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #f0f0f0;">
            <h2 style="font-size:18px; font-weight:800; margin:0; color:var(--forest);">메뉴</h2>
            <button id="sidebar-close-btn" style="background:none; border:none; font-size:24px; cursor:pointer; color:var(--ink-soft);">✕</button>
        </div>
        <ul style="list-style:none; padding:20px; margin:0; display:flex; flex-direction:column; gap:8px;">
            <li sec:authorize="hasRole('ADMIN')"><a th:href="@{/admin}" style="display:block; padding:12px 16px; border-radius:8px; font-size:16px; font-weight:600; text-decoration:none; color:var(--danger); transition:0.2s;" onmouseover="this.style.background='#fff4f4'" onmouseout="this.style.background='none'">👑 관리자 메뉴</a></li>
            <li><a th:href="@{/recommendations}" style="display:block; padding:12px 16px; border-radius:8px; font-size:16px; font-weight:600; text-decoration:none; color:var(--ink); transition:0.2s;" onmouseover="this.style.background='#f4f5f7'" onmouseout="this.style.background='none'">⭐ 관광지 추천</a></li>
            <li><a th:href="@{/party-board}" style="display:block; padding:12px 16px; border-radius:8px; font-size:16px; font-weight:600; text-decoration:none; color:var(--ink); transition:0.2s;" onmouseover="this.style.background='#f4f5f7'" onmouseout="this.style.background='none'">👫 파티 모집 게시판</a></li>
            <li sec:authorize="isAuthenticated()"><a th:href="@{/messages}" style="display:block; padding:12px 16px; border-radius:8px; font-size:16px; font-weight:600; text-decoration:none; color:var(--ink); transition:0.2s;" onmouseover="this.style.background='#f4f5f7'" onmouseout="this.style.background='none'">💬 개인 메시지함</a></li>
        </ul>
    </div>

    <script>
        document.getElementById('profile-btn')?.addEventListener('click', (e) => {
            e.stopPropagation();
            const el = document.getElementById('profile-dropdown');
            if(el) el.style.display = el.style.display === 'none' ? 'block' : 'none';
        });

        document.getElementById('top-notif-bell')?.addEventListener('click', (e) => {
            e.stopPropagation();
            const el = document.getElementById('top-notif-dropdown');
            if(el) el.style.display = el.style.display === 'none' ? 'block' : 'none';
        });

        const sidebar = document.getElementById('right-sidebar');
        document.getElementById('sidebar-toggle-btn')?.addEventListener('click', (e) => {
            e.stopPropagation();
            sidebar.style.right = '0';
        });
        document.getElementById('sidebar-close-btn')?.addEventListener('click', () => {
            sidebar.style.right = '-320px';
        });

        document.addEventListener('click', (e) => {
            const dp1 = document.getElementById('profile-dropdown');
            if(dp1 && !dp1.contains(e.target)) dp1.style.display = 'none';

            const dp2 = document.getElementById('top-notif-dropdown');
            if(dp2 && !dp2.contains(e.target)) dp2.style.display = 'none';

            if (sidebar && sidebar.style.right === '0px' && !sidebar.contains(e.target)) {
                sidebar.style.right = '-320px';
            }
        });
