<head th:fragment="head(pageTitle)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}" th:if="${_csrf != null}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}" th:if="${_csrf != null}"/>
    <title th:text="${pageTitle != null ? pageTitle + ' - Tanoshimi' : 'Tanoshimi'}">Tanoshimi</title>
    
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard-dynamic-subset.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    
    <!-- CSP 호환(인라인 스크립트 허용)용 빈 구조 -->
    <script>
        window.api = {
            async get(url) {
                try {
                    const r = await fetch(url);
                    return await r.json();
                } catch(e) { return {success:false, message:'Network Error'}; }
            },
            async post(url, data) {
                const csrfToken = document.querySelector('meta[name="_csrf"]')?.content;
                const csrfHeader = document.querySelector('meta[name="_csrf_header"]')?.content;
                const headers = { 'Content-Type': 'application/json' };
                if(csrfToken && csrfHeader) headers[csrfHeader] = csrfToken;
                
                try {
                    const r = await fetch(url, {
                        method: 'POST',
                        headers: headers,
                        body: JSON.stringify(data)
                    });
                    return await r.json();
                } catch(e) { return {success:false, message:'Network Error'}; }
            },
            async patch(url, data={}) {
                const csrfToken = document.querySelector('meta[name="_csrf"]')?.content;
                const csrfHeader = document.querySelector('meta[name="_csrf_header"]')?.content;
                const headers = { 'Content-Type': 'application/json' };
                if(csrfToken && csrfHeader) headers[csrfHeader] = csrfToken;
                try {
                    const r = await fetch(url, { method: 'PATCH', headers: headers, body: JSON.stringify(data) });
                    return await r.json();
                } catch(e) { return {success:false, message:'Network Error'}; }
            },
            async del(url) {
                const csrfToken = document.querySelector('meta[name="_csrf"]')?.content;
                const csrfHeader = document.querySelector('meta[name="_csrf_header"]')?.content;
                const headers = {};
                if(csrfToken && csrfHeader) headers[csrfHeader] = csrfToken;
                try {
                    const r = await fetch(url, { method: 'DELETE', headers: headers });
                    return await r.json();
                } catch(e) { return {success:false, message:'Network Error'}; }
            }
        };
    </script>
    <script th:src="@{/js/report.js}" defer></script>
</head>

<header th:fragment="header" style="position:sticky; top:0; z-index:999; background:rgba(255,255,255,0.95); backdrop-filter:blur(8px); border-bottom:1px solid #eaeaea; padding:12px 20px;">
    <div style="max-width:1200px; margin:0 auto; display:flex; justify-content:space-between; align-items:center;">
        <!-- Left Side: Logo & Main Nav -->
        <div style="display:flex; align-items:center; gap:40px;">
            <a th:href="@{/}" style="font-size:24px; font-weight:900; color:var(--forest); text-decoration:none; letter-spacing:-0.5px;">TANOSHIMI</a>
            <nav style="display:flex; gap:24px; font-weight:700; font-size:15px;" class="hide-mobile">
                <a th:href="@{/packages}" style="color:var(--ink); text-decoration:none;">패키지 찾기</a>
                <a th:href="@{/party-board}" style="color:var(--ink); text-decoration:none;">파티 게시판</a>
                <a th:href="@{/my-parties}" sec:authorize="isAuthenticated()" style="color:var(--ink); text-decoration:none;">내 파티</a>
            </nav>
        </div>

        <!-- Right Side -->
        <div style="display:flex; align-items:center; gap:20px;">
            <!-- 언어 변경 -->
            <div style="display:flex; align-items:center; gap:8px; font-weight:700; font-size:14px; background:#f4f5f7; padding:4px 8px; border-radius:8px;">
                <a th:href="@{''(lang=ko)}" th:style="${#locale.language == 'ko' or #locale.language == null} ? 'color:var(--forest);' : 'color:var(--ink-soft); text-decoration:none;'">KO</a>
                <span style="color:#ccc;">|</span>
                <a th:href="@{''(lang=ja)}" th:style="${#locale.language == 'ja'} ? 'color:var(--forest);' : 'color:var(--ink-soft); text-decoration:none;'">JP</a>
            </div>
            
            <th:block sec:authorize="!isAuthenticated()">
                <a th:href="@{/login}" class="btn" style="padding:8px 16px; font-size:14px; background:var(--forest); color:#fff; border-radius:8px; text-decoration:none;">로그인</a>
            </th:block>
            
            <th:block sec:authorize="isAuthenticated()">
                <!-- 프로필사진 + 닉네임 + 드롭다운 -->
                <div style="position:relative;" id="profile-menu-wrap">
                    <div style="display:flex; align-items:center; gap:8px; cursor:pointer;" id="profile-btn">
                        <img th:if="${#authentication.principal.profileImageUrl != null}" th:src="${#authentication.principal.profileImageUrl}" 
                             style="width:36px; height:36px; border-radius:50%; object-fit:cover; border:1px solid #ddd;">
                        <div th:if="${#authentication.principal.profileImageUrl == null}" 
                             style="width:36px; height:36px; border-radius:50%; background:#dceef2; color:#3c5a3a; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:16px; border:1px solid #ddd;"
                             th:text="${#strings.substring(#authentication.principal.displayName,0,1)}"></div>
                        <span style="font-size:14.5px; font-weight:700; color:var(--ink);" th:text="${#authentication.principal.displayName}">닉네임</span>
                    </div>
                    
                    <div id="profile-dropdown" style="display:none; position:absolute; top:50px; right:0; background:#fff; border:1px solid #ddd; border-radius:12px; box-shadow:0 8px 24px rgba(0,0,0,0.12); width:160px; z-index:1000; overflow:hidden;">
                        <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin}" style="display:block; padding:12px 16px; font-size:14px; color:var(--danger); font-weight:700; text-decoration:none; transition:background 0.2s;" onmouseover="this.style.background='#fff4f4'" onmouseout="this.style.background='none'">👑 관리자 메뉴</a>
                        <a th:href="@{/mypage}" style="display:block; padding:12px 16px; font-size:14px; color:var(--ink); text-decoration:none; transition:background 0.2s;" onmouseover="this.style.background='#f9f9f9'" onmouseout="this.style.background='none'">마이페이지</a>
                        <form th:action="@{/logout}" method="post" style="margin:0;">
                            <button type="submit" style="width:100%; text-align:left; padding:12px 16px; font-size:14px; color:var(--danger); background:none; border:none; border-top:1px solid #f0f0f0; cursor:pointer;" onmouseover="this.style.background='#fff4f4'" onmouseout="this.style.background='none'">로그아웃</button>
                        </form>
                    </div>
                </div>
                
                <!-- 알림창 -->
                <div class="notif-wrap" style="position:relative;">
                    <span class="notif-bell" id="top-notif-bell" style="cursor:pointer; font-size:20px; display:flex; align-items:center;">
                        🔔
                        <span class="notif-badge" id="top-notif-badge" style="display:flex; justify-content:center; align-items:center; position:absolute; top:-6px; right:-6px; background:#ff4757; color:#fff; font-size:11px; font-weight:bold; width:18px; height:18px; border-radius:50%;">0</span>
                    </span>
                    <div class="notif-dropdown" id="top-notif-dropdown" style="display:none; position:absolute; top:42px; right:0; background:#fff; border:1px solid #ddd; border-radius:12px; box-shadow:0 8px 30px rgba(0,0,0,0.15); width:320px; z-index:1000; overflow:hidden;">
                        <div style="padding:14px 16px; font-weight:800; font-size:15px; border-bottom:1px solid #f0f0f0; display:flex; justify-content:space-between; align-items:center;">
                            신규 알림
                        </div>
                        <div class="notif-list" id="top-notif-list" style="max-height:350px; overflow-y:auto; padding:0;">
                            <p class="notif-empty" style="text-align:center; font-size:13px; color:#999; padding:40px 0; margin:0;">새로운 알림이 없습니다.</p>
                        </div>
                    </div>
                </div>
            </th:block>

            <!-- 햄버거 메뉴 -->
            <button id="sidebar-toggle-btn" style="background:none; border:none; font-size:26px; cursor:pointer; color:var(--ink); display:flex; align-items:center;">☰</button>
        </div>
    </div>
    
    <!-- 우측 슬라이드 메뉴 -->
    <div id="right-sidebar" style="position:fixed; top:0; right:-320px; width:300px; height:100vh; background:#fff; box-shadow:-8px 0 30px rgba(0,0,0,0.1); z-index:99999; transition:right 0.3s cubic-bezier(0.4, 0.0, 0.2, 1); display:flex; flex-direction:column;">
        <div style="padding:20px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #f0f0f0;">
            <h2 style="font-size:18px; font-weight:800; margin:0; color:var(--forest);">메뉴</h2>
            <button id="sidebar-close-btn" style="background:none; border:none; font-size:24px; cursor:pointer; color:var(--ink-soft);">✕</button>
        </div>
        <ul style="list-style:none; padding:20px; margin:0; display:flex; flex-direction:column; gap:8px;">
            <li sec:authorize="hasRole('ADMIN')"><a th:href="@{/admin}" style="display:block; padding:12px 16px; border-radius:8px; font-size:16px; font-weight:600; text-decoration:none; color:var(--danger); transition:0.2s;" onmouseover="this.style.background='#fff4f4'" onmouseout="this.style.background='none'">👑 관리자 메뉴</a></li>
            <li><a th:href="@{/packages}" style="display:block; padding:12px 16px; border-radius:8px; font-size:16px; font-weight:600; text-decoration:none; color:var(--ink); transition:0.2s;" onmouseover="this.style.background='#f4f5f7'" onmouseout="this.style.background='none'">✈️ 패키지 즐겨보기</a></li>
            <li><a th:href="@{/party-board}" style="display:block; padding:12px 16px; border-radius:8px; font-size:16px; font-weight:600; text-decoration:none; color:var(--ink); transition:0.2s;" onmouseover="this.style.background='#f4f5f7'" onmouseout="this.style.background='none'">🎪 파티 모집 게시판</a></li>
            <li sec:authorize="isAuthenticated()"><a th:href="@{/messages}" style="display:block; padding:12px 16px; border-radius:8px; font-size:16px; font-weight:600; text-decoration:none; color:var(--ink); transition:0.2s;" onmouseover="this.style.background='#f4f5f7'" onmouseout="this.style.background='none'">💬 개인 메시지함</a></li>
        </ul>
    </div>
    
    <script>
        // 프로필 드롭다운 토글
        document.getElementById('profile-btn')?.addEventListener('click', (e) => {
            e.stopPropagation();
            const el = document.getElementById('profile-dropdown');
            if(el) el.style.display = el.style.display === 'none' ? 'block' : 'none';
        });
        
        // 알림창 드롭다운 토글
        document.getElementById('top-notif-bell')?.addEventListener('click', (e) => {
            e.stopPropagation();
            const el = document.getElementById('top-notif-dropdown');
            if(el) el.style.display = el.style.display === 'none' ? 'block' : 'none';
        });

        // 햄버거 메뉴 토글
        const sidebar = document.getElementById('right-sidebar');
        document.getElementById('sidebar-toggle-btn')?.addEventListener('click', (e) => {
            e.stopPropagation();
            sidebar.style.right = '0';
        });
        document.getElementById('sidebar-close-btn')?.addEventListener('click', () => {
            sidebar.style.right = '-320px';
        });
        
        // 바깥 클릭 시 메뉴 닫기
        document.addEventListener('click', (e) => {
            const dp1 = document.getElementById('profile-dropdown');
            if(dp1 && !dp1.contains(e.target)) dp1.style.display = 'none';

            const dp2 = document.getElementById('top-notif-dropdown');
            if(dp2 && !dp2.contains(e.target)) dp2.style.display = 'none';

            if (sidebar && sidebar.style.right === '0px' && !sidebar.contains(e.target)) {
                sidebar.style.right = '-320px';
            }
        });
    </script>
</header>
</html>
