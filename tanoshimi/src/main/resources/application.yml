spring:
  application:
    name: tanoshimi

  profiles:
    active: local
    # 실제 비밀값(DB 비번, OAuth secret, 알리고 키)은 application-local.yml 또는 환경변수로만 주입.
    # application-local.yml 은 .gitignore 처리되어 있음.

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:tanoshimi}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:tanoshimi}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # app.email.provider=smtp 일 때만 실제로 쓰인다(SmtpEmailSender). host 가 비어있으면
  # 발송 시도 자체가 실패하니, 실제 발송을 쓰려면 반드시 application-local.yml/환경변수로 채울 것.
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  jpa:
    hibernate:
      # 스키마는 db/schema.sql 로 직접 관리하며, validate 에서 검증 문제 시 update 옵션 활용
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
    open-in-view: false

  thymeleaf:
    cache: false   # 운영 배포 시 true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope: [profile, email]
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

          naver:
            client-id: ${NAVER_CLIENT_ID:}
            client-secret: ${NAVER_CLIENT_SECRET:}
            client-name: Naver
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: [name, email]

          # v16 제안서 기준 소셜 로그인은 Google·Naver만 사용 (LINE 제외).
          # 코드/설정은 지우지 않고 주석 처리만 해둠 - 팀 논의로 재도입되면 주석만 해제하면 됨.
          # line:
          #   client-id: ${LINE_CLIENT_ID:}
          #   client-secret: ${LINE_CLIENT_SECRET:}
          #   client-name: LINE
          #   authorization-grant-type: authorization_code
          #   redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
          #   scope: [openid, profile, email]
          #   client-authentication-method: client_secret_post

        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

          # line:
          #   authorization-uri: https://access.line.me/oauth2/v2.1/authorize
          #   token-uri: https://api.line.me/oauth2/v2.1/token
          #   user-info-uri: https://api.line.me/oauth2/v2.1/userinfo
          #   user-name-attribute: sub

server:
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: false        # HTTPS 배포 시 반드시 true
        same-site: lax

app:
  # 업로드된 사진(프로필/게시글/파티 썸네일 등) 저장 위치.
  # 일부러 프로젝트 폴더 밖(사용자 홈 디렉토리)에 둔다 - 새 코드를 받아서 프로젝트 폴더를
  # 통째로 교체/재압축할 때 uploads 폴더까지 같이 날아가는 문제가 있었기 때문.
  # 이 경로는 프로젝트와 완전히 분리돼 있어서 몇 번을 새로 받아도 사진은 그대로 남는다.
  upload-dir: ${UPLOAD_DIR:${user.home}/tanoshimi-uploads}

  # [v16 신규] AI 챗봇 추천/동선 최적화 1일 크레딧 - 전 사용자 동일 지급, 자정 초기화.
  ai-credit:
    daily-limit: ${AI_CREDIT_DAILY_LIMIT:20}

  sms:
    provider: log            # log = 콘솔 출력(개발용) / aligo = 실제 발송
    aligo:
      api-url: https://apis.aligo.in/send/
      api-key: ${ALIGO_API_KEY:}
      user-id: ${ALIGO_USER_ID:}
      sender: ${ALIGO_SENDER:}

  # 회원가입 본인인증 채널 - 알리고 등 SMS API가 사업자등록번호 없이는 실사용이 어려워
  # 이메일 인증으로 전환. app.sms.* 는 change_phone 등 다른 목적으로 남겨두고, 회원가입은
  # 이쪽(app.email)을 사용한다.
  email:
    provider: log            # log = 콘솔 출력(개발용) / smtp = 실제 메일 발송
    smtp:
      from: ${MAIL_FROM:no-reply@tanoshimi.local}

  verification:
    code-length: 6
    ttl-seconds: 300
    resend-cooldown-seconds: 30
    max-attempts: 5
    max-daily-requests: 5
    consume-window-seconds: 600

  login:
    max-failures: 5
    lock-minutes: 10

  weather:
    provider: mock            
    api-key: ${WEATHER_API_KEY:}

  translation:
    provider: mock            
    api-key: ${TRANSLATION_API_KEY:}

logging:
  level:
    org.springframework.security: INFO
    net.datasa.tanoshimi: DEBUG